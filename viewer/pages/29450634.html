w28"><strong>Id</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">Container ID</td></tr><tr><td class="table__cell--mw28"><strong>Start</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Starts iterating the container</td></tr></tbody></table></figure></div></div><p><span> </span></p><div><p><strong>Outputs</strong></p><div><figure class="table"><table class="table"><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Error</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">Triggers when an error occurs</td></tr><tr><td class="table__cell--mw28"><strong>Done</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggers when the operation successfully completed</td></tr><tr><td class="table__cell--mw28"><strong>Out</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Outputs the container ID</td></tr></tbody></table></figure></div></div><p><span><br/></span></p></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#container-nodes" class="nav-tabs__item is-active" title="Container Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Container Nodes</div></a><a href="#create" class="nav-tabs__item" title="Create" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Create</div></a><a href="#edit" class="nav-tabs__item" title="Edit" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Edit</div></a><a href="#iterate" class="nav-tabs__item" title="Iterate" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Iterate</div></a></div></div><div class="layout__details--main"></div></div></layout>
