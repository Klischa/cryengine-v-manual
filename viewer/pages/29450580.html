<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="playdialog">PlayDialog</h3><p><span>Used to play a dialog.</span></p><p><picture><img class="picture" src="../attachments/28901223.png"></picture></p><div><p><strong>Inputs</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Play</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Plays the dialog</td></tr><tr><td class="table__cell--mw28"><strong>Stop</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Stops the dialog</td></tr><tr><td class="table__cell--mw28"><strong>Dialog</strong></td><td class="table__cell--mw28">String</td><td class="table__cell--mw28">Name of the dialog to play</td></tr><tr><td class="table__cell--mw28"><strong>StartLine</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">Line to start the dialog from</td></tr><tr><td class="table__cell--mw28"><strong>AI Interrupt</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">AI interrupt behavior; values are Never, Alert, and Combat</td></tr><tr><td class="table__cell--mw28"><strong>AwareDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Distance that player is considered as listening at</td></tr><tr><td class="table__cell--mw28"><strong>AwareAngle</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">View angle that player is considered as listening at</td></tr><tr><td class="table__cell--mw28"><strong>AwareTimeout</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Time out until non-aware player aborts dialog</td></tr><tr><td class="table__cell--mw28"><strong>Flags</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">Dialog playback flags</td></tr><tr><td class="table__cell--mw28"><strong>Buffer</strong></td><td class="table__cell--mw28">String</td><td class="table__cell--mw28">Stores the dialog. Only one dialog can be played at any time in each buffer</td></tr><tr><td class="table__cell--mw28"><strong>BufferDisplay</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">How many more seconds the dialog will wait until the previous dialog in its dialog has finished</td></tr><tr><td class="table__cell--mw28"><strong>Actor 1-8</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Actor entity IDs</td></tr></tbody></table></figure></div></div><div><p><strong>Outputs</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Started</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggered when the dialog has started</td></tr><tr><td class="table__cell--mw28"><strong>Done</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggered when the dialog has finished or aborted</td></tr><tr><td class="table__cell--mw28"><strong>Finished</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggered when the dialog has finished</td></tr><tr><td class="table__cell--mw28"><strong>Aborted</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggered when the dialog has aborted</td></tr><tr><td class="table__cell--mw28"><strong>PlayerAbort</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">Triggered when the dialog has aborted because the player is out of range or out of view</td></tr><tr><td class="table__cell--mw28"><strong>AIAbort</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggered when the dialog has aborted because the AI got alerted</td></tr><tr><td class="table__cell--mw28"><strong>ActorDied</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggered when the dialog has aborted because the Actor died</td></tr><tr><td class="table__cell--mw28"><strong>LastLine</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">Last line played when the dialog was aborted</td></tr><tr><td class="table__cell--mw28"><strong>CurLine</strong></td><td class="table__cell--mw28">Integer</td><td class="table__cell--mw28">Current line; triggered whenever a line starts</td></tr></tbody></table></figure></div></div></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#playdialog" class="nav-tabs__item is-active" title="PlayDialog" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">PlayDialog</div></a></div></div><div class="layout__details--main"></div></div></layout>
