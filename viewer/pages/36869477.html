<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="core-nodes">Core Nodes</h2><p><strong>Core </strong>nodes exhibit functionality for a variety of purposes. </p><h3 id="fail">Fail</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Returns failure as its result, regardless of the outcome of its child's execution. A <strong>Fail</strong> node has exactly one child.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>When execution/processing of its child node is complete.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="random-gate">Random Gate</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Has exactly one child, which is executed when the <strong>Random Gate</strong> node is "open".</p><p>The probability of the gate being "open" is random, although the degree of this randomness may be modified.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Chance to Open</strong></p></td><td class="table__cell--mw28"><p>Modifies the degree of randomness by which the gate is opened.</p></td><td class="table__cell--mw28"><p>Accepts a floating point value in the range [0.0, 1.0] such that,</p><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>0.0</strong></p></td><td class="table__cell--mw28"><p>The Random Gate will always be "closed".</p></td></tr><tr><td class="table__cell--mw28"><p><strong>1.0</strong></p></td><td class="table__cell--mw28"><p>The gate will always be "open".</p></td></tr></tbody></table></figure><p>Any value in between accordingly affects the probability of the gate being "open".</p><p>For example, a <strong>Chance to Open </strong>value of <strong>0.5</strong> gives the gate a 50% chance of being open.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>When the gate is "open" and its child node succeeds.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>If the gate is "closed", or if its child node fails when "open".</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="send-event">Send Event</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Sends an event to the Behavior Tree, that may in turn be used to trigger a change in a Variable, Timestamp, or similar.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Event</strong></p></td><td class="table__cell--mw28"><p>Specifies the Event that should be sent by the node.</p></td><td class="table__cell--mw28"><p>Accepts any <strong>Built-in</strong> or <strong>Game</strong> Event as its value.</p><p>However the Event must be previously defined in the Data Definitions block.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>If the <strong>Event</strong> was successfully sent.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>If the <strong>Event</strong> wasn't sent.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="suppress-failure">Suppress Failure</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Returns success as its result, regardless of the outcome of its child's execution. A <strong>Suppress Failure</strong> node has exactly one child.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p><span>As soon as execution/processing of its child node is complete.</span></p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#core-nodes" class="nav-tabs__item is-active" title="Core Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Core Nodes</div></a><a href="#fail" class="nav-tabs__item" title="Fail" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Fail</div></a><a href="#random-gate" class="nav-tabs__item" title="Random Gate" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Random Gate</div></a><a href="#send-event" class="nav-tabs__item" title="Send Event" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Send Event</div></a><a href="#suppress-failure" class="nav-tabs__item" title="Suppress Failure" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Suppress Failure</div></a></div></div><div class="layout__details--main"></div></div></layout>
