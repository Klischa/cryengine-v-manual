<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h3 id="camera">Camera</h3><p>A camera object is used to define custom views of your level. They can be triggered via the Flow Graph and Track View, and are heavily used within animated sequences.</p><p><picture><img class="picture" src="../attachments/36849618.png"></picture> </p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p>Parameters</p></th><th><p><span>Description</span></p></th></tr><tr><td class="table__cell--mw28"><p><strong>FOV</strong></p></td><td class="table__cell--mw28"><p>The field of view of the camera.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>FarZ</strong></p></td><td class="table__cell--mw28"><p>The max cut off point of the camera.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>NearZ</strong></p></td><td class="table__cell--mw28"><p>The cut off point closest to the camera.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Amplitude A</strong></p></td><td class="table__cell--mw28"><p>Vec3, the strength of the effect on each axis.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Amplitude A Mult.</strong></p></td><td class="table__cell--mw28"><p>Multiplier for the Amplitude.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Frequency A</strong></p></td><td class="table__cell--mw28"><p>Vec3, how off the effect will play in each axis.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Frequency A Mult.</strong></p></td><td class="table__cell--mw28"><p>Multiplier for the Frequency.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Noise A Amplitude Mult.</strong></p></td><td class="table__cell--mw28"><p>Add some noise to the amplitude value.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Noise A Frequency Mult.</strong></p></td><td class="table__cell--mw28"><p>Add some noise to the frequency value.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Time Offset A</strong></p></td><td class="table__cell--mw28"><p>Asome time offset.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Amplitude B</strong></p></td><td class="table__cell--mw28"><p>Vec3, the strength of the effect on each axis.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Amplitude B Mult.</strong></p></td><td class="table__cell--mw28"><p>Multiplier for the Amplitude.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Frequency B</strong></p></td><td class="table__cell--mw28"><p>Vec3, how off the effect will play in each axis.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Frequency B Mult.</strong></p></td><td class="table__cell--mw28"><p>Multiplier for the Frequency.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Noise B Amp. Mult.</strong></p></td><td class="table__cell--mw28"><p>Add some noise to the amplitude value.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Noise B Freq. Mult.</strong></p></td><td class="table__cell--mw28"><p>Add some noise to the frequency value.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Time Offset B</strong></p></td><td class="table__cell--mw28"><p>A some time offset.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Random Seed</strong></p></td><td class="table__cell--mw28"><p>Apply some random variation to the noise.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
