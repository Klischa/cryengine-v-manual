                            <div class="layout__details"><div class="layout__details--header"><h2 id="overview">Overview</h2><p>The following shaders are currently available in CRYENGINE:</p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p><strong>Shader Name</strong></p></th><th><p><strong>Description</strong></p></th></tr><tr><td class="table__cell--mw28"><p><a href="29448860.html" class="link" title="DistanceClouds Shader">DistanceClouds Shader</a></p></td><td class="table__cell--mw28"><p>Used by the environment artists to create 2D DistanceClouds.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448900.html" class="link" title="Eye Shader">Eye Shader</a></p></td><td class="table__cell--mw28"><p>Used by the character artists to create the eyes of characters. Control even the amount of dynamic pupil dilation.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448946.html" class="link" title="Glass Shader">Glass Shader</a></p></td><td class="table__cell--mw28"><p>Used by artists to create glass. Comes with specific features tailored for glass use and also specific breakability functionality.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448981.html" class="link" title="Hair Shader">Hair Shader</a></p></td><td class="table__cell--mw28"><p>Used by character artists to create hair. Gives wide control over coloring and physicalization options.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449035.html" class="link" title="HumanSkin Shader">HumanSkin Shader</a></p></td><td class="table__cell--mw28"><p>Used by character artists and offers a wide variety of options to achieve realistic looking skin.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449070.html" class="link" title="Illum Shader">Illum Shader</a></p></td><td class="table__cell--mw28"><p>The most commonly used shader, can be used to create an extremely wide variety of effects. If there is no specific shader for the type of effect you are trying to achieve, use the Illum Shader.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><a href="44959873.html" class="link" title="Multilayeredmaterials Shader">Multilayeredmaterials Shader</a></p></td><td colspan="1" class="table__cell--mw28"><span>A shader type that is used for modeling materials as a stack of thin layers, including an optional thin-film on top. Each of these layers is a micro-facet surface with its own physical properties, which when combined together, act as a single material with a unique optical response that generally can not be reproduced with the traditional single-layer models.</span></td></tr><tr><td class="table__cell--mw28"><p><a href="29449083.html" class="link" title="NoDraw Shader">NoDraw Shader</a></p></td><td class="table__cell--mw28"><p>Used for physics proxy, the NoDraw Shader forces the Engine to not render the geometry on which the shader is applied. There are no specific Shader Params.<br/>Alternatively, for level design it may be preferable to use <code>Materials/special/collision_proxy_entitiesonly</code>so that you can see the solid in editing mode, but not in Game mode.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449085.html" class="link" title="ParticleImposter Shader">ParticleImposter Shader</a></p></td><td class="table__cell--mw28"><p><span>The ParticleImposter shader is used to create particle effects that are not affected by light and hence do not cast shadows or cause reflections.</span></p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449087.html" class="link" title="Particles Shader">Particles Shader</a></p></td><td class="table__cell--mw28"><p>Used by particle artists.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449090.html" class="link" title="ReferenceImage Shader">ReferenceImage Shader</a></p></td><td class="table__cell--mw28"><p>Forces the Engine to render the object without any shading or post-processing effects.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449106.html" class="link" title="Sky Shader">Sky Shader</a></p></td><td class="table__cell--mw28"><p>Is only used for creating the sky box. The Sky Shader has no parameters, and the materials can only be applied via the Material Settings in the Material Editor.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449154.html" class="link" title="SkyHDR Shader">SkyHDR Shader</a></p></td><td class="table__cell--mw28"><p>Is the same as the Sky Shader, except that if you want to use the dynamically changing sky with the Time Of Day settings, you always have to use the SkyHDR Shader.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449224.html" class="link" title="TemplBeamProc Shader">TemplBeamProc Shader</a></p></td><td class="table__cell--mw28"><p>The TempleBeamProc Shader can be used to create very cheap fog light beam effects.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449280.html" class="link" title="Terrain.Layer Shader">Terrain.Layer Shader</a></p></td><td class="table__cell--mw28"><p>Used for all the terrain materials for painting terrain texture layers.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449329.html" class="link" title="Vegetation Shader">Vegetation Shader</a></p></td><td class="table__cell--mw28"><p>Used for all vegetation.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449362.html" class="link" title="Water Shader">Water Shader</a></p></td><td class="table__cell--mw28"><p>Used for the ocean.</p></td></tr><tr><td class="table__cell--mw28"><p><span><a href="29449415.html" class="link" title="WaterVolume Shader">WaterVolume Shader</a></span></p></td><td class="table__cell--mw28"><p>Used for water volumes and rivers.</p></td></tr></tbody></table></figure><p>The following shaders are obsolete and have been removed in latest versions of CRYENGINE:</p><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th><p><strong>Shader Name</strong></p></th><th><p><strong>Description</strong></p></th><th colspan="1">Removed<br/>in version</th></tr><tr><td class="table__cell--mw28"><p><span>CloakLayer Shader</span></p></td><td class="table__cell--mw28"><p>Used to create see-through / aberration effects.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Common.Cloud Shader</p></td><td class="table__cell--mw28"><p>Used by environment artists to create CloudVolumes.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>GeometryBeam Shader</p></td><td class="table__cell--mw28"><p>Used by artists and level designers to create volumetric light beams imposter.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Lightbeam.LightBeam Shader</p></td><td class="table__cell--mw28"><p>Used by environment lighting artists to create light shafts.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Monitor Shader</p></td><td class="table__cell--mw28"><p>Used by artists to create effects you would typically see on older televisions, such as grain, noise, chroma shift and interlacing. Useful for in-game displays.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Ping Shader</p></td><td class="table__cell--mw28"><p><span>N/A</span></p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Scopes Shader</p></td><td class="table__cell--mw28"><p>Shader specifically tailored for use on weapon scope attachments.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>VolumeObject Shader</p></td><td class="table__cell--mw28"><p>Used for Volume Objects.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Waterfall Shader</p></td><td class="table__cell--mw28"><p>Used for creating layered water effects.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td colspan="1" class="table__cell--mw28"><p>Cloth Shader</p></td><td colspan="1" class="table__cell--mw28"><p>Used mainly by character artists. Gives extra controls for physicalization settings.</p></td><td colspan="1" class="table__cell--mw28">3.7</td></tr><tr><td class="table__cell--mw28"><p>Custom Shader</p></td><td class="table__cell--mw28"><p>N/A</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>EnergyShield Shader</span></p></td><td colspan="1" class="table__cell--mw28"><p>Crysis specific effects.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>FrozenLayerWip Shader</span></p></td><td colspan="1" class="table__cell--mw28"><p>N/A</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>FX_VelocityBeamParticles Shader</span></p></td><td colspan="1" class="table__cell--mw28"><p>Crysis specific effects.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p>Hologram Shader</p></td><td colspan="1" class="table__cell--mw28"><p>N/A</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>LensOptics.Enable Shader</span></p></td><td colspan="1" class="table__cell--mw28"><p>Used for Lens Flare effects.</p></td><td colspan="1" class="table__cell--mw28">3.7</td></tr><tr><td colspan="1" class="table__cell--mw28"><p>LightFlares.Flare Shader</p></td><td colspan="1" class="table__cell--mw28"><p>Used by lighting environment artists to create the corona effect, like a glow on a lamp. Deprecated by lens flare system.</p></td><td colspan="1" class="table__cell--mw28"><span>3.7</span></td></tr><tr><td class="table__cell--mw28"><p>Metal Shader</p></td><td class="table__cell--mw28"><p>Used for metallic objects. Use Illum instead.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td class="table__cell--mw28"><p>WaterSurface Shader</p></td><td class="table__cell--mw28"><p>Used for rivers. Use WaterVolume instead.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td class="table__cell--mw28"><p>WaterVols Shader</p></td><td class="table__cell--mw28"><p>Used for lakes and other water areas. Use WaterVolume instead.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
