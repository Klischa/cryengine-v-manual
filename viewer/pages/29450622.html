<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="attributeget">AttributeGet</h3><p>Returns the value of the specified Attribute.</p><p><picture><img class="picture" src="../attachments/65438697.jpg"></picture></p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Input</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Get</strong></td><td class="table__cell--mw28">Triggers the node.</td></tr><tr><td class="table__cell--mw28"><strong>Attribute</strong></td><td class="table__cell--mw28"><div><p>The name of the Attribute from which the value will be taken.</p><div class="note note--md note--danger"><div class="note__body"><div>Names are case sensitive, please make sure to type the names correctly.</div></div></div></div></td></tr><tr><th>Output</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Value</strong></td><td class="table__cell--mw28">Outputs the value that was taken from the Attribute defined in the Attribute input.</td></tr><tr><td class="table__cell--mw28"><strong>Error</strong></td><td class="table__cell--mw28">Outputs when an error occurs in the acquisition of the Attribute's value.</td></tr></tbody></table></figure><h3 id="attributeset">AttributeSet</h3><p>Changes the value of the specified Attribute.</p><p><picture><img class="picture" src="../attachments/65438696.jpg"></picture></p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Input</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Set</strong></td><td class="table__cell--mw28">Triggers the node.</td></tr><tr><td class="table__cell--mw28"><strong>Attribute</strong></td><td class="table__cell--mw28"><div><p>The name of the Attribute whose the value should be changed.</p><div class="note note--md note--danger"><div class="note__body"><div>Names are case sensitive, please make sure to type the names correctly.</div></div></div></div></td></tr><tr><td colspan="1" class="table__cell--mw28"><strong>Value</strong></td><td colspan="1" class="table__cell--mw28">The new value that the Attribute's value will be set to.</td></tr><tr><th>Output</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Error</strong></td><td class="table__cell--mw28">Outputs when an error occurs in the change of the Attribute's value.</td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#attributeget" class="nav-tabs__item is-active" title="AttributeGet" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">AttributeGet</div></a><a href="#attributeset" class="nav-tabs__item" title="AttributeSet" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">AttributeSet</div></a></div></div><div class="layout__details--main"></div></div></layout>
