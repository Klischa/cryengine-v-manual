                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="readstereoparameters">ReadStereoParameters</h3><p><span>Used to read the HUD stereo display parameters.</span></p><p><span><picture><img class="picture" src="../attachments/29687997.png"></picture></span></p><p><span> </span></p><div><p><strong>Inputs</strong></p><div><figure class="table"><table class="table"><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Read</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Start reading stereo values</td></tr><tr><td class="table__cell--mw28"><strong>Stop</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Stop reading stereo values</td></tr></tbody></table></figure></div></div><p><span> </span></p><div><p><strong>Outputs</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>EyeDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Outputs eye distance</td></tr><tr><td class="table__cell--mw28"><strong>ScreenDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Outputs screen distance</td></tr><tr><td class="table__cell--mw28"><strong>HUDDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Outputs HUD distance</td></tr><tr><td class="table__cell--mw28"><strong>Flipped</strong></td><td class="table__cell--mw28">Boolean</td><td class="table__cell--mw28">Output if stereo is flipped</td></tr></tbody></table></figure></div></div><h3 id="stereoparameters">StereoParameters</h3><p><span>Used to output the HUD stereo display parameters.</span></p><p><span><picture><img class="picture" src="../attachments/29687996.png"></picture></span></p><p><span> </span></p><div><p><strong>Inputs</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>EyeDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Sets the stereo eye distance</td></tr><tr><td class="table__cell--mw28"><strong>ScreenDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Sets the stereo screen distance</td></tr><tr><td class="table__cell--mw28"><strong>HUDDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Sets the stereo HUD distance</td></tr><tr><td class="table__cell--mw28"><strong>Duration</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Duration of the interpolation in seconds</td></tr><tr><td class="table__cell--mw28"><strong>Start</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Starts the interpolation</td></tr></tbody></table></figure></div></div><p><span> </span></p><div><p><strong>Outputs</strong></p><div><figure class="table"><table class="table"><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>CurrentEyeDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Outputs the current eye distance</td></tr><tr><td class="table__cell--mw28"><strong>CurrentScreenDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Outputs the current screen distance</td></tr><tr><td class="table__cell--mw28"><strong>CurrentHUDDistance</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Outputs the current HUD distance</td></tr><tr><td class="table__cell--mw28"><strong>TimeLeft</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Time left to the end of the interpolation</td></tr><tr><td class="table__cell--mw28"><strong>Done</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Outputs when interpolation has completed</td></tr></tbody></table></figure></div></div></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#readstereoparameters" class="nav-tabs__item is-active" title="ReadStereoParameters" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">ReadStereoParameters</div></a><a href="#stereoparameters" class="nav-tabs__item" title="StereoParameters" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">StereoParameters</div></a></div></div><div class="layout__details--main"></div></div></layout>
