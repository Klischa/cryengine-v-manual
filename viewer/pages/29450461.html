<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h2 id="overview">Overview</h2><p>The general properties at the bottom of the Designer tool are always the same. These include:</p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Property</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Display Back Facing Polygons</strong></td><td class="table__cell--mw28"><span>This Editor only feature allows for the showing of backfaces of Designer objects, such as when inside of a building or object.</span></td></tr><tr><td class="table__cell--mw28"><strong>Seamless Edit</strong></td><td class="table__cell--mw28"><span>Enables editing of objects when the mouse cursor is over them.</span></td></tr><tr><td class="table__cell--mw28"><strong>Keep Pivot Center</strong></td><td class="table__cell--mw28"><span>Pivot remains locked during editing</span></td></tr><tr><td class="table__cell--mw28"><strong>Highlight Elements</strong></td><td class="table__cell--mw28"><span>Visualization of the vertices, edges, faces, and pivots.</span></td></tr><tr><td class="table__cell--mw28"><strong>Highlight Box Size</strong></td><td class="table__cell--mw28"><span>First requiring to have Highlight Elements active, this scales the helpers they use.</span></td></tr><tr><td class="table__cell--mw28"><strong>Display Dimension Helper</strong></td><td class="table__cell--mw28"><span>Enables visualization of the object's dimensions: width, height, and depth.</span></td></tr><tr><td class="table__cell--mw28"><strong>Display Triangulation</strong></td><td class="table__cell--mw28"><span>Overlay's the objects's triangulation through an outline.</span></td></tr><tr><td class="table__cell--mw28"><strong>Display Subdivided Result</strong></td><td class="table__cell--mw28"><span>Overlays the object's subdivisions through an outline.</span></td></tr><tr><td class="table__cell--mw28"><strong>Display Vertex Normals</strong></td><td class="table__cell--mw28"><span>Draws normal vertex direction and axis.</span></td></tr><tr><td class="table__cell--mw28"><strong>Display Polygon Normals</strong></td><td class="table__cell--mw28"><span><span>Draws polygon vertex direction and axis.</span></span></td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
                        </article>
</body></html>
