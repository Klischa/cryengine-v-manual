<title>Debugging Navigation</title>

</head><body class="doc">
<div class="topbar"><a href="../index.html" target="_parent">&larr; Contents</a><span class="crumb">Debugging Navigation</span><a class="lang" href="../pages-ru/24281245.html">EN</a></div>
<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><div class="note note--md note--warn"><div class="note__body"><div><p>Ensure to have the cvar ai_debugDraw set to 1 in order for other cvars to show their debug information:</p><pre class="line-numbers"><code class="language-cpp">ai_debugDraw 1</code></pre></div></div></div><h3 id="debugging-the-navmesh">Debugging the NavMesh</h3><figure class="table"><table class="table"><tbody><tr><th>CVar/Command</th><th>Values</th><th>Description</th></tr><tr><td class="table__cell--mw28">ai_debugMNMAgentType</td><td class="table__cell--mw28">e. g. "<code>MediumSizedCharacters</code>"</td><td class="table__cell--mw28">specifies the name of the Agent type for which to draw the NavMesh</td></tr><tr><td class="table__cell--mw28">ai_debugDrawNavigation</td><td class="table__cell--mw28">0/1/2/3/4/5</td><td class="table__cell--mw28">draws the NavMesh with additional information (triangles, islands, etc.) depending on the value of this cvar</td></tr><tr><td class="table__cell--mw28">ai_DebugDrawNavigationWorldMonitor</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">draws red bounding boxes whenever the NavMesh gets regenerated due to world changes</td></tr><tr><td class="table__cell--mw28">ai_MNMAllowDynamicRegenInEditor</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">if enabled, regenerates the NavMesh whenever switching between edit and game mode in Sandbox to ensure the NavMesh is up-to-date when all affecting objects are reverted to their initial state</td></tr><tr><td class="table__cell--mw28">ai_MNMDebugAccessibility</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">if enabled, draws areas that are disconnected from other areas in red</td></tr><tr><td colspan="1" class="table__cell--mw28">ai_MNMProfileMemory</td><td colspan="1" class="table__cell--mw28">0/1</td><td colspan="1" class="table__cell--mw28">if enabled, draws information about the current memory usage, number of triangles, etc. of the NavMesh on a per-Agent basis</td></tr></tbody></table></figure><h3 id="debugging-pathfinding-and-pathfollowing">Debugging Pathfinding and Pathfollowing</h3><figure class="table"><table class="table"><tbody><tr><th>CVar/Command</th><th>Values</th><th>Description</th></tr><tr><td class="table__cell--mw28">ai_DrawPath</td><td class="table__cell--mw28">"<code>none</code>", "<code>all</code>", (desired entity name)</td><td class="table__cell--mw28">draws line-segments and path node numbers along the found path that is about to get traversed</td></tr><tr><td class="table__cell--mw28">ai_DrawPathFollower</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">draws debug information about the look-ahead position to follow while traversing the whole path</td></tr><tr><td class="table__cell--mw28">ai_DebugPathfinding</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">prints some information about the start/end points of the found path to the console</td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
                        </article>
