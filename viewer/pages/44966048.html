<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="debug-draw">Debug Draw</h3><p><span>The Debug Draw component can be used to draw debug text; the text will be drawn at the world position of the parent entity. This component can be useful to mark or highlight specific entities in the world.</span></p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Setting</th><th>Description</th></tr><tr><td colspan="1" class="table__cell--mw28"><strong>Draw Persistent Text</strong></td><td colspan="1" class="table__cell--mw28">Whether persistent text will be drawn to the screen.</td></tr><tr><td colspan="1" class="table__cell--mw28"><strong>Persistent Text</strong></td><td colspan="1" class="table__cell--mw28">The persistent text to draw to the screen.</td></tr><tr><td colspan="1" class="table__cell--mw28"><strong>Persistent Text Color</strong></td><td colspan="1" class="table__cell--mw28">The color of the persistent text.</td></tr><tr><td colspan="1" class="table__cell--mw28"><strong>Persistent View Distance</strong></td><td colspan="1" class="table__cell--mw28">The maximum view distance for the persistent text.</td></tr><tr><td colspan="1" class="table__cell--mw28"><strong>Persistent Font Size</strong></td><td colspan="1" class="table__cell--mw28">The font size of the persistent text.</td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#debug-draw" class="nav-tabs__item is-active" title="Debug Draw" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Debug Draw</div></a></div></div><div class="layout__details--main"></div></div></layout>
