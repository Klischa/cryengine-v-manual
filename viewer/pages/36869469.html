<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="conditions-nodes">Conditions Nodes</h2><p>The functioning of <strong>Conditions </strong>nodes is based on the value of Variables previously defined in the <a href="36869459.html" rel="noreferrer, nofollow, noopener">Data Definitions </a>block of the Behavior Tree Editor.</p><h3 id="condition-gate">Condition gate</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Has exactly one child, which is only executed if the Condition gate is "open".</p><p>A gate is "open" only when the condition associated with it is satisfied.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Condition</strong></p></td><td class="table__cell--mw28"><p>Specifies the condition that needs to be evaluated for the gate to be opened/closed.</p></td><td class="table__cell--mw28"><p>Accepts a logical expression containing Variables <span>(for example, </span><em>!a and b, </em><span>where </span><em>a</em><span> and </span><em>b</em><strong> </strong><span>are variables)</span>, that must return True/False as its result.</p><p>Any Variables used must be defined in the Data Definitions block.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>When the Condition gate node is "open" and it's child node succeeds.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>If the gate is "closed", or if its child node fails when the gate is "open".</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="check-condition">Check Condition </h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Checks if a specified condition has been satisfied.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Condition</strong></p></td><td class="table__cell--mw28"><p>Specifies the condition that needs to be evaluated.</p></td><td class="table__cell--mw28"><p>Accepts a logical expression containing Variables (for example, <em>!a and b, </em>where <em>a</em> and <em>b</em><strong> </strong>are variables), that must return True/False as its result.</p><p>Any Variables used must be defined in the Data Definitions block.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>If the specified <strong>Condition</strong> is satisfied.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>If the <strong>Condition</strong> isn't satisfied.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#conditions-nodes" class="nav-tabs__item is-active" title="Conditions Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Conditions Nodes</div></a><a href="#condition-gate" class="nav-tabs__item" title="Condition gate" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Condition gate</div></a><a href="#check-condition" class="nav-tabs__item" title="Check Condition" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Check Condition</div></a></div></div><div class="layout__details--main"></div></div></layout>
