<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="time-nodes">Time Nodes</h2><p>The execution of<strong> Time</strong> nodes is influenced by the effect of time. </p><h3 id="timeout">Timeout </h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Runs for a specified amount of time before failing.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Duration</strong></p></td><td class="table__cell--mw28"><p>Specifies the time, in seconds, for which the node must be processed before yielding Failure as a result.</p></td><td class="table__cell--mw28"><p>Accepts a floating point integer that represents the <strong>Duration</strong>, in seconds.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>When the Timeout node is processed for the entirety of the specified <strong>Duration</strong>.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="timestamp-gate">Timestamp Gate</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Has exactly one child that is executed when the Timestamp gate is "open".</p><p>A gate is "open", if a Timestamp associated with it yields a value that either exceeds or fails to reach a specified duration of time as per a defined <strong>Comparator.</strong></p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Timestamp</strong></p></td><td class="table__cell--mw28"><p>Specifies the Timestamp to track.</p></td><td class="table__cell--mw28"><p>Accepts the name of a Timestamp.</p><p>The Timestamp must be previously defined in the <strong>Timestamp</strong> section of the Data Definitions block.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Comparator</strong></p></td><td colspan="1" class="table__cell--mw28"><p>The logic by which a Timestamp must be compared against a defined <strong>Duration.</strong></p></td><td colspan="1" class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>More Than</strong></p></td><td class="table__cell--mw28"><p>Checks if the <strong>Timestamp</strong> exceeds the specified <strong>Duration.</strong></p></td></tr><tr><td class="table__cell--mw28"><p><strong>Less Than</strong></p></td><td class="table__cell--mw28"><p>Checks if the <strong>Timestamp </strong>fails to reach the specified <strong>Duration</strong>.</p></td></tr></tbody></table></figure></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Duration</strong></p></td><td colspan="1" class="table__cell--mw28"><p>The duration of time against which the specified Timestamp must be compared.</p></td><td colspan="1" class="table__cell--mw28"><p><span>Accepts a floating point integer that represents the </span><strong>Duration</strong><span>, in seconds.</span></p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Open If It Was Never Set</strong></p></td><td colspan="1" class="table__cell--mw28"><p>Forces the node to succeed if no Timestamp is specified in the node's Timestamp parameter field.</p></td><td colspan="1" class="table__cell--mw28"><p>Boolean; ticking the provided checkbox will "open" the Timestamp gate node whenever no Timestamp has been specified.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><ul class="list-review list-review--md"><li class="list-review__item">If the gate is "open" and its child node succeeds.</li><li class="list-review__item">If no Timestamp is specified in the node's <strong>Timestamp</strong> parameter field, and the <strong>Open If It Was Never</strong> <strong>Set </strong>checkbox is checked.</li></ul></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><ul class="list-review list-review--md"><li class="list-review__item">If the gate is "closed", or its child node failed when "open".</li><li class="list-review__item">If no Timestamp is specified in the node's <strong>Timestamp</strong> parameter field, and the <strong>Open If It Was Never Set</strong> checkbox is not checked.</li></ul></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="wait">Wait</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Runs for a specified amount of time before returning a successful result.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Duration</strong></p></td><td class="table__cell--mw28"><p>Specifies the time, in seconds, for which the node must be processed before yielding a successful result.</p></td><td class="table__cell--mw28"><p>Accepts a floating point integer that represents the <strong>Duration</strong>, in seconds.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Variation</strong></p></td><td colspan="1" class="table__cell--mw28"><p>Applies a variation to the <strong>Duration</strong> value specified above, such that the node is processed for a duration ranging between the values <strong>Duration</strong> and <strong>Duration+Variation.</strong></p></td><td colspan="1" class="table__cell--mw28"><p>Accepts a floating point integer that represents the <strong>Variation</strong>, in seconds.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>When the nodes runs for a longer time than the specified <strong>Duration</strong>, with <strong>Variation</strong> included.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="wait-for-condition">Wait for Condition</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Evaluates a given condition continuously until satisfied.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Condition</strong></p></td><td class="table__cell--mw28"><p>Specifies the condition that needs to be evaluated continuously.</p></td><td class="table__cell--mw28"><p>Accepts a logical expression containing Variables (for example, <em>!a and</em> <em>b</em>, where <em>a</em> and <em>b</em> are variables), that must return True/False as its result.</p><p>Any Variables used must be defined in the Data Definitions block of the Behavior Tree Editor.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>When the specified <strong>Condition</strong> is evaluated true.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="wait-for-event">Wait for Event</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Waits until a specific Event has been received.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Event</strong></p></td><td class="table__cell--mw28"><p>Specifies the Event the node must wait for.</p></td><td class="table__cell--mw28"><p>Accepts any <strong>Built-in</strong> or <strong>Game</strong> Event as its value.</p><p>However, the Event must be previously defined in the Data Definitions block of the Behavior Tree Editor.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><p>When the specified <strong>Event</strong> is received.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="wait-for-timestamp">Wait for Timestamp</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Waits until a specified time-based has been satisfied.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Timestamp</strong></p></td><td class="table__cell--mw28"><p>Specifies the <strong>Timestamp</strong> to track.</p></td><td class="table__cell--mw28"><p>Accepts the name of a <strong>Timestamp</strong>.</p><p>The Timestamp must be previously defined in the <strong>Timestamp</strong> section of the Data Definitions block.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Comparator</strong></p></td><td class="table__cell--mw28"><p><span>The logic by which a </span><strong>Timestamp</strong><span> must be compared against a defined </span><strong>Duration.</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>More Than</strong></p></td><td class="table__cell--mw28"><p>Checks if the <strong>Timestamp</strong> exceeds the defined <strong>Duration</strong>.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Less Than</strong></p></td><td class="table__cell--mw28"><p>Checks if the <strong>Timestamp</strong> fails to reach the specified Duration.</p></td></tr></tbody></table></figure></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Duration</strong></p></td><td colspan="1" class="table__cell--mw28"><p><span>The duration of time against which the specified </span><strong>Timestamp</strong><span> must be compared.</span></p></td><td colspan="1" class="table__cell--mw28"><p><span>Accepts a floating point integer that represents the </span><strong>Duration</strong><span>, in seconds.</span></p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Succeed If It Was Never Set</strong></p></td><td colspan="1" class="table__cell--mw28"><p><span>Forces the node to succeed if no Timestamp is specified in the node's </span><strong>Timestamp</strong><span> parameter field.</span></p></td><td colspan="1" class="table__cell--mw28"><p><span>Boolean; ticking the provided checkbox will "open" the Timestamp gate node whenever no </span><strong>Timestamp</strong><span> has been specified.</span></p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><ul class="list-review list-review--md"><li class="list-review__item">When the <strong>Comparator</strong> between the specified <strong>Timestamp</strong> and <strong>Duration </strong>yields true.</li><li class="list-review__item">If no Timestamp is specified in the node's <strong>Timestamp</strong> parameter field, and the <strong>Succeed If It Was Never</strong> <strong>Set </strong>checkbox is checked.</li></ul></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#time-nodes" class="nav-tabs__item is-active" title="Time Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Time Nodes</div></a><a href="#timeout" class="nav-tabs__item" title="Timeout" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Timeout</div></a><a href="#timestamp-gate" class="nav-tabs__item" title="Timestamp Gate" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Timestamp Gate</div></a><a href="#wait" class="nav-tabs__item" title="Wait" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Wait</div></a><a href="#wait-for-condition" class="nav-tabs__item" title="Wait for Condition" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Wait for Condition</div></a><a href="#wait-for-event" class="nav-tabs__item" title="Wait for Event" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Wait for Event</div></a><a href="#wait-for-timestamp" class="nav-tabs__item" title="Wait for Timestamp" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Wait for Timestamp</div></a></div></div><div class="layout__details--main"></div></div></layout>
