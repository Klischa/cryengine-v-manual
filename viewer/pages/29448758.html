<div class="topbar"><a href="../index.html" target="_parent">&larr; Contents</a><span class="crumb">Shaders in CRYENGINE</span><a class="lang" href="../pages-ru/29448758.html">EN</a></div>
<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h3 id="overview">Overview</h3><p>The following shaders are currently available in CRYENGINE:</p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p><span>Shader Name</span></p></th><th><p><span>Description</span></p></th></tr><tr><td class="table__cell--mw28"><p><a href="29448860.html" class="link" title="DistanceClouds Shader">DistanceClouds Shader</a></p></td><td class="table__cell--mw28"><p>Used by Environment Artists to create 2D DistanceClouds.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448900.html" class="link" title="Eye Shader">Eye Shader</a></p></td><td class="table__cell--mw28"><p>Used by Character Artists to create the eyes of characters. Can also control the amount of dynamic pupil dilation.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448946.html" class="link" title="Glass Shader">Glass Shader</a></p></td><td class="table__cell--mw28"><p>Used by Artists to create glass. Comes with specific features that are tailored for glass use and also specific breakability functionality.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448981.html" class="link" title="Hair Shader">Hair Shader</a></p></td><td class="table__cell--mw28"><p>Used by Character Artists to create hair. Gives wide control over coloring and physicalization options.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449035.html" class="link" title="HumanSkin Shader">HumanSkin Shader</a></p></td><td class="table__cell--mw28"><p>Used by Character Artists and offers a wide variety of options to achieve realistic looking skin.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449070.html" class="link" title="Illum Shader">Illum Shader</a></p></td><td class="table__cell--mw28"><p>The most commonly used shader, can be used to create an extremely wide variety of effects. If there is no specific shader for the type of effect you are trying to achieve, use the Illum Shader.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><a href="44959873.html" class="link" title="Multilayeredmaterials Shader">Multilayeredmaterials Shader</a></td><td colspan="1" class="table__cell--mw28">A shader tha can be used to combine different layers of materials to achieve unique and realistic surfaces.</td></tr><tr><td class="table__cell--mw28"><p><a href="29449083.html" class="link" title="NoDraw Shader">NoDraw Shader</a></p></td><td class="table__cell--mw28"><p>Used for physics proxy. The NoDraw Shader forces the Engine to not render the geometry on which the shader is applied. There are no specific Shader Params.<br/>Alternatively, for level design it may be preferable to use <code>Materials/special/collision_proxy_entitiesonly</code>, so that you can see the solid in Editing mode, but not in Game mode.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449085.html" class="link" title="ParticleImposter Shader">ParticleImposter Shader</a></p></td><td class="table__cell--mw28"><p><span>The ParticleImposter shader is used to create particle effects that are not affected by light and hence do not cast shadows or cause reflections.</span></p><p><span> </span></p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449087.html" class="link" title="Particles Shader">Particles Shader</a></p></td><td class="table__cell--mw28"><p>Used by Artists who require particle effects.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449090.html" class="link" title="ReferenceImage Shader">ReferenceImage Shader</a></p></td><td class="table__cell--mw28"><p>Forces the Engine to render the object without any shading or post-processing effects.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449106.html" class="link" title="Sky Shader">Sky Shader</a></p></td><td class="table__cell--mw28"><p>Is only used for creating the sky box. The Sky Shader has no parameters, and the materials can only be applied through the Material settings via the Material Editor.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449154.html" class="link" title="SkyHDR Shader">SkyHDR Shader</a></p></td><td class="table__cell--mw28"><p>Is the same as the Sky Shader, with the exception, that if you want to use a dynamically changing sky through the Time Of Day settings, then you always have to use the SkyHDR Shader.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449224.html" class="link" title="TemplBeamProc Shader">TemplBeamProc Shader</a></p></td><td class="table__cell--mw28"><p>The TempleBeamProc Shader can be used to create very cheap fog light beam effects.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449280.html" class="link" title="Terrain.Layer Shader">Terrain.Layer Shader</a></p></td><td class="table__cell--mw28"><p>Used for all the terrain materials for painting terrain texture layers.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449329.html" class="link" title="Vegetation Shader">Vegetation Shader</a></p></td><td class="table__cell--mw28"><p>Used for all vegetation.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449362.html" class="link" title="Water Shader">Water Shader</a></p></td><td class="table__cell--mw28"><p>Used for the ocean.</p></td></tr><tr><td class="table__cell--mw28"><p><span><a href="29449415.html" class="link" title="WaterVolume Shader">WaterVolume Shader</a></span></p></td><td class="table__cell--mw28"><p>Used for water volumes and rivers.</p></td></tr></tbody></table></figure><h2 id="in-this-topic"> In This Topic</h2><ul class="list list--md"><li class="list__item"><a href="29449533.html" class="link" title="Shader Features (Shader Generation Params)" rel="noreferrer, nofollow, noopener">Shader Features (Shader Generation Params)</a></li><li class="list__item"><a href="29448786.html" class="link" title="Shader Reference" rel="noreferrer, nofollow, noopener">Shader Reference</a></li></ul></div><div class="layout__details--aside"></div></div>
