<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h2 id="cvars-and-console-commands">CVars and Console Commands</h2><h3 id="cvars">CVars</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>CVar</th><th>Description</th></tr><tr><td class="table__cell--mw28">uqs_timeBudgetInSeconds</td><td class="table__cell--mw28">Specifies the time budget (in seconds) that the UQS is allowed to use for each update call. Internally, it will split up this time budget among all currently running queries to provide the best possible load balance. Setting this CVar to a value lower than or equal to 0.0 means that the absolute minimal amount of time-sliced work possible will be performed internally. In this case, complex queries will most likely be distributed over multiple Engine frames, thus taking a considerable amount of time until finished.</td></tr><tr><td class="table__cell--mw28">uqs_debugDraw</td><td class="table__cell--mw28">If set to 1, draws some statistics and the list of ongoing queries as 2D text on screen. Also, it will have the ongoing queries draw debug-rendering primitives in the 3D world for up to 2 seconds after they have finished.</td></tr><tr><td class="table__cell--mw28">uqs_debugDrawZTestOn</td><td class="table__cell--mw28">If set to 1, then the debug-rendering primitives of queries will enable z-testing when being drawn in the 3D world.</td></tr><tr><td class="table__cell--mw28">uqs_debugDrawLineThickness</td><td class="table__cell--mw28">Specifies the thickness of debug-rendering lines in the 3D world. This can be used to visualize, for example a raycast when otherwise it would be difficult to see.</td></tr><tr><td class="table__cell--mw28">uqs_logQueryHistory</td><td class="table__cell--mw28">If set to 1, then all running queries will also get recorded into a query history in memory. That history can be saved and restored either via the <strong>Query History Inspector</strong> Editor plugin (or via console commands <strong>UQS_DumpQueryHistory</strong> / <strong>UQS_LoadQueryHistory</strong>, see below) and be loaded into the <strong>Query History Inspector</strong> for later inspection.</td></tr></tbody></table></figure><h3 id="console-commands">Console Commands</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Console Command</th><th>Description</th></tr><tr><td class="table__cell--mw28">UQS_ListFactoryDatabases</td><td class="table__cell--mw28">Prints all registered factories for creating items, functions, generators and evaluators to the console.</td></tr><tr><td class="table__cell--mw28">UQS_ListQueryBlueprintLibrary</td><td class="table__cell--mw28">Prints all query blueprints in the library to the console.</td></tr><tr><td class="table__cell--mw28">UQS_ListRunningQueries</td><td class="table__cell--mw28">Prints all currently running queries to the console.</td></tr><tr><td class="table__cell--mw28">UQS_DumpQueryHistory</td><td class="table__cell--mw28">Dumps all queries that were executed so far to an XML file for de-serialization at a later time. Saving the current history in memory to disk is also possible via the <strong>Query History Inspector</strong> Editor plugin.</td></tr><tr><td class="table__cell--mw28">UQS_LoadQueryHistory</td><td class="table__cell--mw28">Loads a history of queries from an XML for debug-rendering and inspection in the 3D world. Loading a history from disk into memory is also possible via the <strong>Query History Inspector</strong> Editor plugin.</td></tr><tr><td class="table__cell--mw28">UQS_ClearDeserialzedQueryHistory</td><td class="table__cell--mw28">Clears the history of queries previously loaded from disk into memory. This is also possible via the <strong>Query History Inspector</strong> Editor plugin.</td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#cvars-and-console-commands" class="nav-tabs__item is-active" title="CVars and Console Commands" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">CVars and Console Commands</div></a><a href="#cvars" class="nav-tabs__item" title="CVars" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">CVars</div></a><a href="#console-commands" class="nav-tabs__item" title="Console Commands" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Console Commands</div></a></div></div></div>
