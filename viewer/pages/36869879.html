<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="spline-distributor">Spline Distributor</h2><p><span>You can make precise changes to the geometry by adjusting the spline points and parameters.</span></p><p><picture><img class="picture" src="../attachments/44969527.png"></picture></p><h4 id="parameters">Parameters</h4><div><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p>Parameter</p></th><th><p>Description</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Geometry</strong></p></td><td class="table__cell--mw28"><p>This option specifies the geometry that needs to be used for the object.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Step Size</strong></p></td><td class="table__cell--mw28"><p>Sets the distance between each point along the spline. Smaller values increase the polygon count of the surface but also smooths out corners.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Follow Spline</strong></p></td><td colspan="1" class="table__cell--mw28"><p>When enabled, follows the spline specified in the level.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Outdoor Only</strong></p></td><td class="table__cell--mw28"><p>When set, the object will not be rendered when inside a visarea.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Rain Occluder</strong></p></td><td class="table__cell--mw28"><p>Set the brush to occlude rain, this works in conjunction with Rain Entity. If your level does contain rain, you should set this wisely, as there is a limit of 512 objects that can occlude at any given time.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Support Second VisArea</strong></p></td><td class="table__cell--mw28"><p>Normally, objects are considered to be in only one visarea. This option allows them to be added to multiple visareas if their bounding box overlaps them, at the cost of some performance. Without this option, some large objects may not be displayed when viewed through portals in certain situations.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Hideable</strong></p></td><td class="table__cell--mw28"><p>When this option is set, AI will use this object as a hiding spot, using the specified hide point type.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Lod Ratio</strong></p></td><td class="table__cell--mw28"><p>Defines how far from the current camera position, the different Level Of Detail models for the object are used.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>View Dist Ratio</strong></p></td><td class="table__cell--mw28"><p>Sets the distance from the current view at which the object renders.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Not Triangulate</strong></p></td><td class="table__cell--mw28"><p>Deprecated</p></td></tr><tr><td class="table__cell--mw28"><p><strong>No Static Decals</strong></p></td><td class="table__cell--mw28"><p>When this option is set, decals will not project onto the object.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Recv Wind</strong></p></td><td class="table__cell--mw28"><p>When this option is set, the object will be affected by the level wind.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Occluder</strong></p></td><td class="table__cell--mw28"><p>Used for the construction of a level occlusion mesh.</p></td></tr></tbody></table></figure></div></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#spline-distributor" class="nav-tabs__item is-active" title="Spline Distributor" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Spline Distributor</div></a><a href="#parameters" class="nav-tabs__item" title="Parameters" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Parameters</div></a></div></div><div class="layout__details--main"></div></div></layout>
