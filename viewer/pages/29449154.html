<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h2 id="overview">Overview</h2><p><span>The SkyHDR shader is used to render realistic dynamic sky effects that change based on the time of day in a level.</span></p><h3 id="shader-generation-params">Shader Generation Params</h3><p>The <span>Shader Generation Parameters consists of the following options: </span></p><figure class="table"><table class="table"><tbody><tr><th>Parameter</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong><span>No Moon</span></strong></td><td class="table__cell--mw28">Removes the moon for the dynamic sky.</td></tr><tr><td class="table__cell--mw28"><strong><span>No Night Sky Gradient</span></strong></td><td class="table__cell--mw28">Removes the entire day night effect gradient for the dynamic sky.</td></tr><tr><td class="table__cell--mw28"><strong><span>No Day Sky Gradient</span></strong></td><td class="table__cell--mw28">Removes the entire day sky effect gradient for the dynamic sky.</td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
                        </article>
