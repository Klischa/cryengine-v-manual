<pre class="line-numbers"><code class="language-html">GameToken.SetToken( TokenName, TokenValue )</code></pre>
      
        <h3 id="gettoken">GetToken</h3>
        <p> Get the value of a game token. </p>
<pre class="line-numbers"><code class="language-html">GameToken.GetToken( TokenName )</code></pre>
      
        <h3 id="dumpalltokens">DumpAllTokens</h3>
        <p> Dump all game tokens with their values to the log. </p>
<pre class="line-numbers"><code class="language-html">GameToken.DumpAllTokens()</code></pre>
