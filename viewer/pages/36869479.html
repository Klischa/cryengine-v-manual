<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="debug-nodes">Debug Nodes</h2><p><strong>Debug </strong>nodes are primarily used to log in-game information for purposes of debugging. </p><h3 id="check-timestamp">Check Timestamp</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Checks if a <strong>Timestamp</strong> exceeds or fails to reach a specified duration of time as per a defined <strong>Comparator</strong>.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Timestamp</strong></p></td><td class="table__cell--mw28"><p>Specifies the <strong>Timestamp</strong> to track.</p></td><td class="table__cell--mw28"><p>Accepts the name of a <strong>Timestamp</strong>.</p><p>The Timestamp must be previously defined in the <strong>Timestamp</strong> section of the Data Definitions block of the Behavior Tree Editor.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Comparator</strong></p></td><td class="table__cell--mw28"><p>The logic by which a <strong>Timestamp</strong> must be compared against a defined <strong>Duration.</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>More Than</strong></p></td><td class="table__cell--mw28"><p>Checks if the <strong>Timestamp</strong> exceeds the specified <strong>Duration</strong>.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Less Than</strong></p></td><td class="table__cell--mw28"><p>Checks if the <strong>Timestamp</strong> fails to reach the specified <strong>Duration.</strong></p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Duration</strong></p></td><td class="table__cell--mw28"><p>The duration of time against which the specified <strong>Timestamp</strong> must be compared.</p></td><td class="table__cell--mw28"><p>Accepts a floating point integer that represents the <strong>Duration</strong>, in seconds.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Succeed If It Was Never Set</strong></p></td><td class="table__cell--mw28"><p><span>Forces the node to succeed if no Timestamp is specified in the node's </span><strong>Timestamp</strong><span> parameter field.</span></p></td><td class="table__cell--mw28"><p>Boolean; ticking the provided checkbox will force the node to succeed.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><ul class="list-review list-review--md"><li class="list-review__item">When the <strong>Comparator</strong> between the specified <strong>Timestamp</strong> and <strong>Duration </strong>yields true.</li><li class="list-review__item">If no Timestamp is specified in the node's <strong>Timestamp</strong> parameter field, and the <strong>Succeed If It Was Never</strong> <strong>Set </strong>checkbox is checked.</li></ul></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="halt">Halt</h3><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><p>Permanently stops execution of the behavior tree.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><div><span>Never.</span></div></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure><h3 id="log-message">Log Message</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Description</strong></p></td><td class="table__cell--mw28"><div><p>Logs a message in the behavior tree log.</p><div class="note note--md note--help"><div class="note__body"><div><p>Use the Behavior Tree Editor's <strong><a href="36869459.html" rel="noreferrer, nofollow, noopener">Debug</a> </strong>options for a visualization of log messages and the tree's sequence of execution.</p></div></div></div></div></td></tr><tr><td class="table__cell--mw28"><p><strong>Parameters Accepted</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Parameter Name</p></th><th><p>Description</p></th><th><p>Value</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Message</strong></p></td><td class="table__cell--mw28"><p>Specifies the message the node must log.</p></td><td class="table__cell--mw28"><p>Accepts a string value.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Results</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Outcome</p></th><th colspan="1"><p>Criteria</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Success</strong></p></td><td class="table__cell--mw28"><div><span>When the specified <strong>Message</strong> is logged.</span></div></td></tr><tr><td class="table__cell--mw28"><p><strong>Failure</strong></p></td><td class="table__cell--mw28"><p>Never.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Additional Information</strong></p></td><td class="table__cell--mw28"><p>None.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#debug-nodes" class="nav-tabs__item is-active" title="Debug Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Debug Nodes</div></a><a href="#check-timestamp" class="nav-tabs__item" title="Check Timestamp" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Check Timestamp</div></a><a href="#halt" class="nav-tabs__item" title="Halt" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Halt</div></a><a href="#log-message" class="nav-tabs__item" title="Log Message" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Log Message</div></a></div></div><div class="layout__details--main"></div></div></layout>
