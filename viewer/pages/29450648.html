                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="videoclipcapture">Video:ClipCapture</h3><p><span>Used to capture video clips while a game is running and save them locally or to the cloud.</span></p><p><picture><img class="picture" src="../attachments/29688102.png"></picture></p><div><p><strong>Inputs</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>Capture</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Begins capturing a video clip</td></tr><tr><td class="table__cell--mw28"><strong>DurationBefore</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Records the specified number of seconds before the<strong>Capture</strong> input triggers</td></tr><tr><td class="table__cell--mw28"><strong>DurationAfter</strong></td><td class="table__cell--mw28">Float</td><td class="table__cell--mw28">Records the specified number of seconds after the<strong>Capture</strong> input triggers</td></tr><tr><td class="table__cell--mw28"><strong>ClipName</strong></td><td class="table__cell--mw28">String</td><td class="table__cell--mw28">Usage details are specific to the operating system</td></tr><tr><td class="table__cell--mw28"><strong>LocalizedClipName</strong></td><td class="table__cell--mw28">String</td><td class="table__cell--mw28">Usage details are specific to the operating system</td></tr><tr><td class="table__cell--mw28"><strong>Metadata</strong></td><td class="table__cell--mw28">String</td><td class="table__cell--mw28">(Optional) Tags video clips</td></tr></tbody></table></figure></div></div><div><p><strong>Outputs</strong></p><div><figure class="table"><table class="table"><tbody><tr><th>Port</th><th>Type</th><th>Description</th></tr><tr><td class="table__cell--mw28"><strong>BeganCapture</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggers when video clip capturing begins</td></tr><tr><td class="table__cell--mw28"><strong>Error</strong></td><td class="table__cell--mw28">Any</td><td class="table__cell--mw28">Triggers when a clip capture error occurs</td></tr></tbody></table></figure></div></div><h3 id="videovideoplayback">Video:VideoPlayback</h3><p><span><span>Video player node that is using USMPlayer UIElement.</span></span></p><p><span><picture><img class="picture" src="../attachments/29688101.png"></picture></span></p><p><span><br/></span></p></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#videoclipcapture" class="nav-tabs__item is-active" title="Video:ClipCapture" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Video:ClipCapture</div></a><a href="#videovideoplayback" class="nav-tabs__item" title="Video:VideoPlayback" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Video:VideoPlayback</div></a></div></div><div class="layout__details--main"></div></div></layout>
