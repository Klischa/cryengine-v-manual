<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="spline-distributor">Сплайновый дистрибьютор</h2><p><span>Вы можете вносить точные изменения в геометрию, регулируя точки и параметры сплайна.</span></p><p><picture><img class="picture" src="../attachments/44969527.png"></picture></p><h4 id="parameters">Параметры</h4><div><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p>Параметр</p></th><th><p>Описание</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Геометрия</strong></p></td><td class="table__cell--mw28"><p>Эта опция определяет геометрию, которую необходимо использовать для объекта.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Размер шага</strong></p></td><td class="table__cell--mw28"><p>Устанавливает расстояние между каждой точкой сплайна. Меньшие значения увеличивают количество полигонов поверхности, но также сглаживают углы.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><strong>Следовать за сплайном</strong></p></td><td colspan="1" class="table__cell--mw28"><p>Если этот параметр включен, следует за сплайном, указанным на уровне.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Только на открытом воздухе</strong></p></td><td class="table__cell--mw28"><p>Если этот параметр установлен, объект не будет отображаться, находясь внутри зоны обзора.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Окклюдер дождя</strong></p></td><td class="table__cell--mw28"><p>Установите кисть на перекрытие дождя, это работает в сочетании с Rain Entity. Если на вашем уровне есть дождь, вам следует настроить его с умом, поскольку существует ограничение в 512 объектов, которые могут перекрываться в любой момент времени.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Поддержка вторая VisArea</strong></p></td><td class="table__cell--mw28"><p>Обычно считается, что объекты находятся только в одной визовой зоне. Эта опция позволяет добавлять их в несколько визовых областей, если их ограничивающая рамка перекрывает их, за счет некоторой производительности. Без этой опции некоторые крупные объекты могут не отображаться при просмотре через порталы в определенных ситуациях.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Скрываемый</strong></p></td><td class="table__cell--mw28"><p>Если эта опция установлена, AI будет использовать этот объект в качестве укрытия, используя указанный тип точки укрытия.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Коэффициент Лод</strong></p></td><td class="table__cell--mw28"><p>Определяет, насколько далеко от текущего положения камеры используются различные модели уровня детализации объекта.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Посмотреть соотношение расстояний</strong></p></td><td class="table__cell--mw28"><p>Устанавливает расстояние от текущего вида, на котором отображается объект.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Не триангулировать</strong></p></td><td class="table__cell--mw28"><p>Устарело</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Никаких статических наклеек</strong></p></td><td class="table__cell--mw28"><p>Если этот параметр установлен, декали не будут проецироваться на объект.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Получение ветра</strong></p></td><td class="table__cell--mw28"><p>Если эта опция установлена, на объект будет влиять горизонтальный ветер.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Окклюдер</strong></p></td><td class="table__cell--mw28"><p>Используется для построения сетки окклюзии уровня.</p></td></tr></tbody></table></figure></div></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#spline-distributor" class="nav-tabs__item is-active" title="Spline Distributor" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Сплайновый дистрибьютор</div></a><a href="#parameters" class="nav-tabs__item" title="Parameters" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Параметры</div></a></div></div><div class="layout__details--main"></div></div></layout>
