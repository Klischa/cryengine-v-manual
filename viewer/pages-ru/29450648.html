                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="videoclipcapture">Видео: ClipCapture</h3><p><span>Используется для захвата видеоклипов во время работы игры и сохранения их локально или в облаке.</span></p><p><picture><img class="picture" src="../attachments/29688102.png"></picture></p><div><p><strong>Входы</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Порт</th><th>Тип</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Захват</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Начинает захват видеоклипа</td></tr><tr><td class="table__cell--mw28"><strong>DurationBefore</strong></td><td class="table__cell--mw28">Плавать</td><td class="table__cell--mw28">Записывает указанное количество секунд до<strong>Захват</strong> входные триггеры</td></tr><tr><td class="table__cell--mw28"><strong>DurationAfter</strong></td><td class="table__cell--mw28">Плавать</td><td class="table__cell--mw28">Записывает указанное количество секунд после<strong>Захват</strong> входные триггеры</td></tr><tr><td class="table__cell--mw28"><strong>ClipName</strong></td><td class="table__cell--mw28">Строка</td><td class="table__cell--mw28">Подробности использования зависят от операционной системы.</td></tr><tr><td class="table__cell--mw28"><strong>LocalizedClipName</strong></td><td class="table__cell--mw28">Строка</td><td class="table__cell--mw28">Подробности использования зависят от операционной системы.</td></tr><tr><td class="table__cell--mw28"><strong>Метаданные</strong></td><td class="table__cell--mw28">Строка</td><td class="table__cell--mw28">(Необязательно) Теги видеоклипов</td></tr></tbody></table></figure></div></div><div><p><strong>Выходы</strong></p><div><figure class="table"><table class="table"><tbody><tr><th>Порт</th><th>Тип</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>BeganCapture</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Срабатывает, когда начинается захват видеоклипа</td></tr><tr><td class="table__cell--mw28"><strong>Ошибка</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Срабатывает при возникновении ошибки захвата клипа</td></tr></tbody></table></figure></div></div><h3 id="videovideoplayback">Видео: VideoPlayback</h3><p><span><span>Узел видеоигрока, использующий USMPlayer UIElement.</span></span></p><p><span><picture><img class="picture" src="../attachments/29688101.png"></picture></span></p><p><span><br/></span></p></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#videoclipcapture" class="nav-tabs__item is-active" title="Video:ClipCapture" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Видео: ClipCapture</div></a><a href="#videovideoplayback" class="nav-tabs__item" title="Video:VideoPlayback" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Видео: VideoPlayback</div></a></div></div><div class="layout__details--main"></div></div></layout>
