                            <div class="layout__details"><div class="layout__details--header"><h3 id="camera">Камера</h3><p>Объект камеры используется для определения пользовательских видов вашего уровня. Их можно активировать с помощью Flow Graph и Track View, и они активно используются в анимационных эпизодах.</p><p><picture><img class="picture" src="../attachments/36849618.png"></picture> </p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p>Параметры</p></th><th><p><span>Описание</span></p></th></tr><tr><td class="table__cell--mw28"><p><strong>FOV</strong></p></td><td class="table__cell--mw28"><p>Поле зрения камеры.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>FarZ</strong></p></td><td class="table__cell--mw28"><p>Максимальная точка отсечки камеры.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>NearZ</strong></p></td><td class="table__cell--mw28"><p>Точка обрезки, ближайшая к камере.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Амплитуда А</strong></p></td><td class="table__cell--mw28"><p>Vec3, сила воздействия по каждой оси.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Амплитуда Множ.</strong></p></td><td class="table__cell--mw28"><p>Множитель для амплитуды.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Частота А</strong></p></td><td class="table__cell--mw28"><p>Vec3, как выключен эффект будет играть по каждой оси.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Частота A Множ.</strong></p></td><td class="table__cell--mw28"><p>Множитель частоты.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Шум Амплитуда Множ.</strong></p></td><td class="table__cell--mw28"><p>Добавьте немного шума к значению амплитуды.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Шум A Частота Mult.</strong></p></td><td class="table__cell--mw28"><p>Добавьте немного шума к значению частоты.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Смещение времени А</strong></p></td><td class="table__cell--mw28"><p>Некоторое смещение времени.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Амплитуда Б</strong></p></td><td class="table__cell--mw28"><p>Vec3, сила воздействия по каждой оси.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Амплитуда B Множ.</strong></p></td><td class="table__cell--mw28"><p>Множитель для амплитуды.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Частота Б</strong></p></td><td class="table__cell--mw28"><p>Vec3, как выключен эффект будет играть по каждой оси.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Частота B Множ.</strong></p></td><td class="table__cell--mw28"><p>Множитель частоты.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Усилитель шума B. Мульт.</strong></p></td><td class="table__cell--mw28"><p>Добавьте немного шума к значению амплитуды.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Частота шума B. Мульт.</strong></p></td><td class="table__cell--mw28"><p>Добавьте немного шума к значению частоты.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Смещение времени Б</strong></p></td><td class="table__cell--mw28"><p>Некоторое смещение во времени.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Случайное семя</strong></p></td><td class="table__cell--mw28"><p>Примените к шуму некоторые случайные вариации.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
