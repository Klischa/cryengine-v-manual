<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h3 id="overview">Обзор</h3><p>В настоящее время в CRYENGINE доступны следующие шейдеры:</p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p><span>Имя шейдера</span></p></th><th><p><span>Описание</span></p></th></tr><tr><td class="table__cell--mw28"><p><a href="29448860.html" class="link" title="DistanceClouds Shader">DistanceClouds Шейдер</a></p></td><td class="table__cell--mw28"><p>Используется художниками по окружению для создания 2D-изображений DistanceClouds.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448900.html" class="link" title="Eye Shader">Шейдер для глаз</a></p></td><td class="table__cell--mw28"><p>Используется художниками по персонажам для создания глаз персонажей. Также можно контролировать степень динамического расширения зрачков.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448946.html" class="link" title="Glass Shader">Стеклянный шейдер</a></p></td><td class="table__cell--mw28"><p>Используется художниками для создания стекла. Поставляется со специальными функциями, специально разработанными для использования со стеклом, а также с особыми функциями разрушения.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448981.html" class="link" title="Hair Shader">Шейдер для волос</a></p></td><td class="table__cell--mw28"><p>Используется художниками по персонажам для создания волос. Предоставляет широкий контроль над параметрами окраски и физикализации.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449035.html" class="link" title="HumanSkin Shader">HumanSkin Шейдер</a></p></td><td class="table__cell--mw28"><p>Используется художниками по персонажам и предлагает широкий выбор вариантов для достижения реалистичного вида кожи.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449070.html" class="link" title="Illum Shader">Освещенный шейдер</a></p></td><td class="table__cell--mw28"><p>Наиболее часто используемый шейдер можно использовать для создания чрезвычайно широкого спектра эффектов. Если для эффекта, которого вы пытаетесь достичь, нет специального шейдера, используйте Illum Shader.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><a href="44959873.html" class="link" title="Multilayeredmaterials Shader">Шейдер многослойных материалов</a></td><td colspan="1" class="table__cell--mw28">Шейдер, который можно использовать для объединения различных слоев материалов для создания уникальных и реалистичных поверхностей.</td></tr><tr><td class="table__cell--mw28"><p><a href="29449083.html" class="link" title="NoDraw Shader">NoDraw Шейдер</a></p></td><td class="table__cell--mw28"><p>Используется для физического прокси. Шейдер NoDraw заставляет движок не отображать геометрию, к которой применяется шейдер. Конкретных параметров шейдера нет.<br/>Альтернативно, для дизайна уровней может быть предпочтительнее использовать <code>Materials/special/collision_proxy_entitiesonly</code>, чтобы вы могли видеть сплошное изображение в режиме редактирования, но не в режиме игры.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449085.html" class="link" title="ParticleImposter Shader">ParticleImposter Шейдер</a></p></td><td class="table__cell--mw28"><p><span>Шейдер ParticleImposter используется для создания эффектов частиц, на которые не влияет свет и, следовательно, они не отбрасывают тени и не вызывают отражений.</span></p><p><span> </span></p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449087.html" class="link" title="Particles Shader">Шейдер частиц</a></p></td><td class="table__cell--mw28"><p>Используется художниками, которым требуются эффекты частиц.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449090.html" class="link" title="ReferenceImage Shader">ReferenceImage Шейдер</a></p></td><td class="table__cell--mw28"><p>Заставляет движок визуализировать объект без каких-либо эффектов затенения или постобработки.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449106.html" class="link" title="Sky Shader">Небесный шейдер</a></p></td><td class="table__cell--mw28"><p>Используется только для создания скайбокса. У шейдера неба нет параметров, и материалы можно применять только через настройки материала через Material Editor.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449154.html" class="link" title="SkyHDR Shader">SkyHDR Шейдер</a></p></td><td class="table__cell--mw28"><p>То же самое, что и шейдер неба, за исключением того, что если вы хотите использовать динамически меняющееся небо через настройки времени суток, вам всегда придется использовать шейдер SkyHDR.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449224.html" class="link" title="TemplBeamProc Shader">TemplBeamProc Шейдер</a></p></td><td class="table__cell--mw28"><p>Шейдер TempleBeamProc можно использовать для создания очень дешевых эффектов луча туманных фонарей.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449280.html" class="link" title="Terrain.Layer Shader">Terrain.Layer Шейдер</a></p></td><td class="table__cell--mw28"><p>Используется для всех материалов ландшафта для рисования слоев текстуры ландшафта.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449329.html" class="link" title="Vegetation Shader">Шейдер растительности</a></p></td><td class="table__cell--mw28"><p>Используется для всей растительности.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449362.html" class="link" title="Water Shader">Шейдер воды</a></p></td><td class="table__cell--mw28"><p>Используется для океана.</p></td></tr><tr><td class="table__cell--mw28"><p><span><a href="29449415.html" class="link" title="WaterVolume Shader">WaterVolume Шейдер</a></span></p></td><td class="table__cell--mw28"><p>Используется для водных объемов и рек.</p></td></tr></tbody></table></figure><h2 id="in-this-topic"> В этой теме</h2><ul class="list list--md"><li class="list__item"><a href="29449533.html" class="link" title="Shader Features (Shader Generation Params)" rel="noreferrer, nofollow, noopener">Функции шейдера (параметры генерации шейдера)</a></li><li class="list__item"><a href="29448786.html" class="link" title="Shader Reference" rel="noreferrer, nofollow, noopener">Справочник по шейдерам</a></li></ul></div><div class="layout__details--aside"></div></div>
