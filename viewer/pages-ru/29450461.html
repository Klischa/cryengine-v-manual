<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h2 id="overview">Обзор</h2><p>Общие свойства в нижней части инструмента «Дизайнер» всегда одинаковы. К ним относятся:</p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Недвижимость</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Отображать полигоны, обращенные назад</strong></td><td class="table__cell--mw28"><span>Эта функция, доступная только в редакторе, позволяет отображать задние поверхности объектов Designer, например, внутри здания или объекта.</span></td></tr><tr><td class="table__cell--mw28"><strong>Бесшовное редактирование</strong></td><td class="table__cell--mw28"><span>Позволяет редактировать объекты, когда на них наведен курсор мыши.</span></td></tr><tr><td class="table__cell--mw28"><strong>Сохраняйте центр разворота</strong></td><td class="table__cell--mw28"><span>Поворот остается заблокированным во время редактирования</span></td></tr><tr><td class="table__cell--mw28"><strong>Выделить элементы</strong></td><td class="table__cell--mw28"><span>Визуализация вершин, ребер, граней и поворотов.</span></td></tr><tr><td class="table__cell--mw28"><strong>Выделите размер коробки</strong></td><td class="table__cell--mw28"><span>Во-первых, требуется, чтобы элементы Highlight были активными, это масштабирует используемые ими помощники.</span></td></tr><tr><td class="table__cell--mw28"><strong>Помощник по отображению размеров</strong></td><td class="table__cell--mw28"><span>Позволяет визуализировать размеры объекта: ширину, высоту и глубину.</span></td></tr><tr><td class="table__cell--mw28"><strong>Отобразить триангуляцию</strong></td><td class="table__cell--mw28"><span>Наложение триангуляции объектов через контур.</span></td></tr><tr><td class="table__cell--mw28"><strong>Отображение разделенного результата</strong></td><td class="table__cell--mw28"><span>Накладывает подразделения объекта на контур.</span></td></tr><tr><td class="table__cell--mw28"><strong>Отображение нормалей вершин</strong></td><td class="table__cell--mw28"><span>Рисует нормальное направление вершин и ось.</span></td></tr><tr><td class="table__cell--mw28"><strong>Отображение нормалей многоугольника</strong></td><td class="table__cell--mw28"><span><span>Рисует направление и ось вершины многоугольника.</span></span></td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
