                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="attributeget">AttributeGet</h3><p>Возвращает значение указанного атрибута.</p><p><picture><img class="picture" src="../attachments/65438697.jpg"></picture></p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Ввод</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Получить</strong></td><td class="table__cell--mw28">Запускает узел.</td></tr><tr><td class="table__cell--mw28"><strong>Атрибут</strong></td><td class="table__cell--mw28"><div><p>Имя атрибута, из которого будет взято значение.</p><div class="note note--md note--danger"><div class="note__body"><div>Имена чувствительны к регистру, пожалуйста, убедитесь, что вводите имена правильно.</div></div></div></div></td></tr><tr><th>Выход</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Значение</strong></td><td class="table__cell--mw28">Выводит значение, полученное из атрибута, определенного во входных данных атрибута.</td></tr><tr><td class="table__cell--mw28"><strong>Ошибка</strong></td><td class="table__cell--mw28">Выводит, когда возникает ошибка при получении значения атрибута.</td></tr></tbody></table></figure><h3 id="attributeset">AttributeSet</h3><p>Изменяет значение указанного Атрибута.</p><p><picture><img class="picture" src="../attachments/65438696.jpg"></picture></p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Ввод</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Установить</strong></td><td class="table__cell--mw28">Запускает узел.</td></tr><tr><td class="table__cell--mw28"><strong>Атрибут</strong></td><td class="table__cell--mw28"><div><p>Имя атрибута, значение которого необходимо изменить.</p><div class="note note--md note--danger"><div class="note__body"><div>Имена чувствительны к регистру, пожалуйста, убедитесь, что вводите имена правильно.</div></div></div></div></td></tr><tr><td colspan="1" class="table__cell--mw28"><strong>Значение</strong></td><td colspan="1" class="table__cell--mw28">Новое значение, которому будет присвоено значение атрибута.</td></tr><tr><th>Выход</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Ошибка</strong></td><td class="table__cell--mw28">Выводит, когда возникает ошибка при изменении значения Атрибута.</td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#attributeget" class="nav-tabs__item is-active" title="AttributeGet" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">AttributeGet</div></a><a href="#attributeset" class="nav-tabs__item" title="AttributeSet" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">AttributeSet</div></a></div></div><div class="layout__details--main"></div></div></layout>
