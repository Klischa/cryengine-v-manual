<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="conditions-nodes">Узлы условий</h2><p>Функционирование <strong>Условия </strong>узлов основано на значениях переменных, ранее определенных в <a href="36869459.html" rel="noreferrer, nofollow, noopener">Определения данных </a>блок редактора дерева поведения.</p><h3 id="condition-gate">Состояние ворот</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Имеет ровно один дочерний элемент, который выполняется только в том случае, если вентиль Condition «открыт».</p><p>Ворота «открыты» только тогда, когда выполнено связанное с ними условие.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Имя параметра</p></th><th><p>Описание</p></th><th><p>Значение</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Состояние</strong></p></td><td class="table__cell--mw28"><p>Указывает условие, которое необходимо оценить, чтобы ворота открылись/закрылись.</p></td><td class="table__cell--mw28"><p>Принимает логическое выражение, содержащее переменные. <span>(например, </span><em>!а и б, </em><span>где </span><em>а</em><span> и </span><em>б</em><strong> </strong><span>являются переменными)</span>, который должен возвращать True/False в качестве результата.</p><p>Любые используемые переменные должны быть определены в блоке «Определения данных».</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><p>Когда узел вентиля состояния «открыт» и его дочерний узел завершается успешно.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Если ворота «закрыты» или если их дочерний узел выходит из строя, когда ворота «открыты».</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure><h3 id="check-condition">Проверить состояние </h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Проверяет, выполнено ли заданное условие.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Имя параметра</p></th><th><p>Описание</p></th><th><p>Значение</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Состояние</strong></p></td><td class="table__cell--mw28"><p>Указывает условие, которое необходимо оценить.</p></td><td class="table__cell--mw28"><p>Принимает логическое выражение, содержащее переменные (например, <em>!а и б, </em>где <em>а</em> и <em>б</em><strong> </strong>являются переменными), которые должны возвращать True/False в качестве результата.</p><p>Любые используемые переменные должны быть определены в блоке «Определения данных».</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><p>Если указанный <strong>Состояние</strong> удовлетворен.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Если <strong>Состояние</strong> не удовлетворен.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#conditions-nodes" class="nav-tabs__item is-active" title="Conditions Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Узлы условий</div></a><a href="#condition-gate" class="nav-tabs__item" title="Condition gate" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Состояние ворот</div></a><a href="#check-condition" class="nav-tabs__item" title="Check Condition" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Проверить состояние</div></a></div></div><div class="layout__details--main"></div></div></layout>
