<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><div class="note note--md note--warn"><div class="note__body"><div><p>Убедитесь, что для квара ai_debugDraw установлено значение 1, чтобы другие квары отображали свою отладочную информацию:</p><pre class="line-numbers"><code class="language-cpp">ai_debugDraw 1</code></pre></div></div></div><h3 id="debugging-the-navmesh">Отладка NavMesh</h3><figure class="table"><table class="table"><tbody><tr><th>CVar/Команда</th><th>Ценности</th><th>Описание</th></tr><tr><td class="table__cell--mw28">ai_debugMNMAgentType</td><td class="table__cell--mw28">е. г. "<code>MediumSizedCharacters</code>"</td><td class="table__cell--mw28">указывает имя типа агента, для которого рисуется NavMesh</td></tr><tr><td class="table__cell--mw28">ai_debugDrawNavigation</td><td class="table__cell--mw28">0/1/2/3/4/5</td><td class="table__cell--mw28">рисует NavMesh с дополнительной информацией (треугольниками, островами и т. д.) в зависимости от значения этой переменной</td></tr><tr><td class="table__cell--mw28">ai_DebugDrawNavigationWorldMonitor</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">рисует красные ограничивающие рамки всякий раз, когда NavMesh регенерируется из-за изменений в мире</td></tr><tr><td class="table__cell--mw28">ai_MNMAllowDynamicRegenInEditor</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">если включено, обновляет NavMesh при каждом переключении между режимом редактирования и игровым режимом в Sandbox, чтобы обеспечить актуальность NavMesh, когда все влияющие объекты возвращаются в исходное состояние.</td></tr><tr><td class="table__cell--mw28">ai_MNMDebugAccessibility</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">если включено, рисует области, которые отключены от других областей, красным цветом</td></tr><tr><td colspan="1" class="table__cell--mw28">ai_MNMProfileMemory</td><td colspan="1" class="table__cell--mw28">0/1</td><td colspan="1" class="table__cell--mw28">если включено, извлекает информацию о текущем использовании памяти, количестве треугольников и т. д. NavMesh для каждого агента.</td></tr></tbody></table></figure><h3 id="debugging-pathfinding-and-pathfollowing">Отладка поиска пути и следования по пути</h3><figure class="table"><table class="table"><tbody><tr><th>CVar/Команда</th><th>Ценности</th><th>Описание</th></tr><tr><td class="table__cell--mw28">ai_DrawPath</td><td class="table__cell--mw28">"<code>none</code>", "<code>all</code>", (желаемое имя объекта)</td><td class="table__cell--mw28">рисует сегменты линий и номера узлов пути вдоль найденного пути, который вот-вот будет пройден</td></tr><tr><td class="table__cell--mw28">ai_DrawPathFollower</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">рисует отладочную информацию о позиции просмотра вперед, которой следует следовать при прохождении всего пути</td></tr><tr><td class="table__cell--mw28">ai_DebugPathfinding</td><td class="table__cell--mw28">0/1</td><td class="table__cell--mw28">выводит на консоль некоторую информацию о начальных/конечных точках найденного пути</td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
                        </article>
