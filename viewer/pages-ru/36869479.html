                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="debug-nodes">Узлы отладки</h2><p><strong>Отладка </strong>узлы в основном используются для регистрации внутриигровой информации в целях отладки. </p><h3 id="check-timestamp">Проверьте временную метку</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Проверяет, есть ли <strong>Временная метка</strong> превышает или не достигает указанной продолжительности времени в соответствии с определенным <strong>Компаратор</strong>.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Имя параметра</p></th><th><p>Описание</p></th><th><p>Значение</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Временная метка</strong></p></td><td class="table__cell--mw28"><p>Указывает <strong>Временная метка</strong> отслеживать.</p></td><td class="table__cell--mw28"><p>Принимает имя <strong>Временная метка</strong>.</p><p>Временная метка должна быть предварительно определена в <strong>Временная метка</strong> раздел блока «Определения данных» редактора дерева поведения.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Компаратор</strong></p></td><td class="table__cell--mw28"><p>Логика, по которой <strong>Временная метка</strong> необходимо сравнивать с определенным <strong>Продолжительность.</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>Более чем</strong></p></td><td class="table__cell--mw28"><p>Проверяет, <strong>Временная метка</strong> превышает указанный <strong>Продолжительность</strong>.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Меньше чем</strong></p></td><td class="table__cell--mw28"><p>Проверяет, <strong>Временная метка</strong> не достигает указанного <strong>Продолжительность.</strong></p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Продолжительность</strong></p></td><td class="table__cell--mw28"><p>Продолжительность времени, в течение которого указанный <strong>Временная метка</strong> надо сравнивать.</p></td><td class="table__cell--mw28"><p>Принимает целое число с плавающей запятой, которое представляет <strong>Продолжительность</strong>, в секундах.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Успех, если он никогда не был установлен</strong></p></td><td class="table__cell--mw28"><p><span>Принудительно завершает работу узла, если в файле узла не указана временная метка. </span><strong>Временная метка</strong><span> поле параметра.</span></p></td><td class="table__cell--mw28"><p>логическое значение; установка предоставленного флажка приведет к успешному выполнению узла.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><ul class="list-review list-review--md"><li class="list-review__item">Когда <strong>Компаратор</strong> между указанными <strong>Временная метка</strong> и <strong>Продолжительность </strong>дает истину.</li><li class="list-review__item">Если в файле узла не указана временная метка <strong>Временная метка</strong> поле параметра и <strong>Успех, если его никогда не было</strong> <strong>Установить </strong>флажок установлен.</li></ul></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Никогда.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure><h3 id="halt">Остановиться</h3><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Навсегда останавливает выполнение дерева поведения.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><div><span>Никогда.</span></div></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Никогда.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure><h3 id="log-message">Сообщение журнала</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><div><p>Записывает сообщение в журнал дерева поведения.</p><div class="note note--md note--help"><div class="note__body"><div><p>Используйте редактор дерева поведения <strong><a href="36869459.html" rel="noreferrer, nofollow, noopener">Отладка</a> </strong>опции для визуализации сообщений журнала и последовательности выполнения дерева.</p></div></div></div></div></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Имя параметра</p></th><th><p>Описание</p></th><th><p>Значение</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Сообщение</strong></p></td><td class="table__cell--mw28"><p>Указывает сообщение, которое узел должен регистрировать.</p></td><td class="table__cell--mw28"><p>Принимает строковое значение.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><div><span>Когда указанное <strong>Сообщение</strong> регистрируется.</span></div></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Никогда.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#debug-nodes" class="nav-tabs__item is-active" title="Debug Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Узлы отладки</div></a><a href="#check-timestamp" class="nav-tabs__item" title="Check Timestamp" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Проверьте временную метку</div></a><a href="#halt" class="nav-tabs__item" title="Halt" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Остановиться</div></a><a href="#log-message" class="nav-tabs__item" title="Log Message" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Сообщение журнала</div></a></div></div><div class="layout__details--main"></div></div></layout>
