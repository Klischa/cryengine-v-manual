                            <div class="layout__details"><div class="layout__details--header"><h2 id="overview">Обзор</h2><p><span>Шейдер SkyHDR используется для визуализации реалистичных динамических эффектов неба, которые меняются в зависимости от времени суток на уровне.</span></p><h3 id="shader-generation-params">Параметры генерации шейдеров</h3><p> <span>Параметры генерации шейдера состоят из следующих опций: </span></p><figure class="table"><table class="table"><tbody><tr><th>Параметр</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong><span>Нет Луны</span></strong></td><td class="table__cell--mw28">Удаляет луну для динамического неба.</td></tr><tr><td class="table__cell--mw28"><strong><span>Нет градиента ночного неба</span></strong></td><td class="table__cell--mw28">Удаляет весь градиент эффекта дня и ночи для динамического неба.</td></tr><tr><td class="table__cell--mw28"><strong><span>Нет дневного градиента неба</span></strong></td><td class="table__cell--mw28">Удаляет весь градиент эффекта дневного неба для динамического неба.</td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
