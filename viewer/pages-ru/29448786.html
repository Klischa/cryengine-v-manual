                            <div class="layout__details"><div class="layout__details--header"><h2 id="overview">Обзор</h2><p>В настоящее время в CRYENGINE доступны следующие шейдеры:</p><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th><p><strong>Имя шейдера</strong></p></th><th><p><strong>Описание</strong></p></th></tr><tr><td class="table__cell--mw28"><p><a href="29448860.html" class="link" title="DistanceClouds Shader">DistanceClouds Шейдер</a></p></td><td class="table__cell--mw28"><p>Используется художниками по окружению для создания 2D DistanceClouds.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448900.html" class="link" title="Eye Shader">Шейдер для глаз</a></p></td><td class="table__cell--mw28"><p>Используется художниками по персонажам для создания глаз персонажей. Контролируйте даже степень динамического расширения зрачков.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448946.html" class="link" title="Glass Shader">Стеклянный шейдер</a></p></td><td class="table__cell--mw28"><p>Используется художниками для создания стекла. Поставляется со специальными функциями, специально разработанными для использования со стеклом, а также с особыми функциями разрушения.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29448981.html" class="link" title="Hair Shader">Шейдер для волос</a></p></td><td class="table__cell--mw28"><p>Используется художниками по персонажам для создания волос. Предоставляет широкий контроль над параметрами окраски и физикализации.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449035.html" class="link" title="HumanSkin Shader">HumanSkin Шейдер</a></p></td><td class="table__cell--mw28"><p>Используется художниками по персонажам и предлагает широкий выбор вариантов для достижения реалистичного вида кожи.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449070.html" class="link" title="Illum Shader">Освещенный шейдер</a></p></td><td class="table__cell--mw28"><p>Наиболее часто используемый шейдер можно использовать для создания чрезвычайно широкого спектра эффектов. Если для эффекта, которого вы пытаетесь достичь, нет специального шейдера, используйте Illum Shader.</p></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><a href="44959873.html" class="link" title="Multilayeredmaterials Shader">Шейдер многослойных материалов</a></p></td><td colspan="1" class="table__cell--mw28"><span>Тип шейдера, который используется для моделирования материалов в виде набора тонких слоев, включая дополнительную тонкую пленку сверху. Каждый из этих слоев представляет собой микрофасетную поверхность со своими физическими свойствами, которые при объединении действуют как единый материал с уникальным оптическим откликом, который обычно невозможно воспроизвести с помощью традиционных однослойных моделей.</span></td></tr><tr><td class="table__cell--mw28"><p><a href="29449083.html" class="link" title="NoDraw Shader">NoDraw Шейдер</a></p></td><td class="table__cell--mw28"><p>Используемый в качестве физического прокси шейдер NoDraw заставляет движок не отображать геометрию, к которой применяется шейдер. Конкретных параметров шейдера нет.<br/>Альтернативно, для дизайна уровней может быть предпочтительнее использовать <code>Materials/special/collision_proxy_entitiesonly</code>чтобы вы могли видеть сплошное изображение в режиме редактирования, но не в режиме игры.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449085.html" class="link" title="ParticleImposter Shader">ParticleImposter Шейдер</a></p></td><td class="table__cell--mw28"><p><span>Шейдер ParticleImposter используется для создания эффектов частиц, на которые не влияет свет и, следовательно, они не отбрасывают тени и не вызывают отражений.</span></p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449087.html" class="link" title="Particles Shader">Шейдер частиц</a></p></td><td class="table__cell--mw28"><p>Используется художниками по частицам.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449090.html" class="link" title="ReferenceImage Shader">ReferenceImage Шейдер</a></p></td><td class="table__cell--mw28"><p>Заставляет движок визуализировать объект без каких-либо эффектов затенения или постобработки.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449106.html" class="link" title="Sky Shader">Небесный шейдер</a></p></td><td class="table__cell--mw28"><p>Используется только для создания скайбокса. У шейдера неба нет параметров, а материалы можно применять только через настройки материала в Material Editor.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449154.html" class="link" title="SkyHDR Shader">SkyHDR Шейдер</a></p></td><td class="table__cell--mw28"><p>То же, что и шейдер неба, за исключением того, что если вы хотите использовать динамически меняющееся небо с настройками времени суток, вам всегда придется использовать шейдер SkyHDR.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449224.html" class="link" title="TemplBeamProc Shader">TemplBeamProc Шейдер</a></p></td><td class="table__cell--mw28"><p>Шейдер TempleBeamProc можно использовать для создания очень дешевых эффектов луча туманных фонарей.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449280.html" class="link" title="Terrain.Layer Shader">Terrain.Layer Шейдер</a></p></td><td class="table__cell--mw28"><p>Используется для всех материалов ландшафта для рисования слоев текстуры ландшафта.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449329.html" class="link" title="Vegetation Shader">Шейдер растительности</a></p></td><td class="table__cell--mw28"><p>Используется для всей растительности.</p></td></tr><tr><td class="table__cell--mw28"><p><a href="29449362.html" class="link" title="Water Shader">Шейдер воды</a></p></td><td class="table__cell--mw28"><p>Используется для океана.</p></td></tr><tr><td class="table__cell--mw28"><p><span><a href="29449415.html" class="link" title="WaterVolume Shader">WaterVolume Шейдер</a></span></p></td><td class="table__cell--mw28"><p>Используется для водных объемов и рек.</p></td></tr></tbody></table></figure><p>Следующие шейдеры устарели и были удалены в последних версиях CRYENGINE:</p><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th><p><strong>Имя шейдера</strong></p></th><th><p><strong>Описание</strong></p></th><th colspan="1">Удален<br/>в версии</th></tr><tr><td class="table__cell--mw28"><p><span>CloakLayer Шейдер</span></p></td><td class="table__cell--mw28"><p>Используется для создания эффектов прозрачности/аберрации.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Common.Cloud шейдер</p></td><td class="table__cell--mw28"><p>Используется художниками по окружению для создания CloudVolumes.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>GeometryBeam Шейдер</p></td><td class="table__cell--mw28"><p>Используется художниками и дизайнерами уровней для создания объемных световых лучей-самозванцев.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Lightbeam.LightBeam Шейдер</p></td><td class="table__cell--mw28"><p>Используется художниками по освещению для создания световых шахт.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Мониторный шейдер</p></td><td class="table__cell--mw28"><p>Используется художниками для создания эффектов, которые обычно можно увидеть на старых телевизорах, таких как зернистость, шум, сдвиг цветности и чересстрочная развертка. Полезно для внутриигровых дисплеев.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Пинг-шейдер</p></td><td class="table__cell--mw28"><p><span>Н/Д</span></p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Шейдер областей</p></td><td class="table__cell--mw28"><p>Шейдер, специально созданный для использования с насадками для оружейных прицелов.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>VolumeObject Шейдер</p></td><td class="table__cell--mw28"><p>Используется для объектов тома.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td class="table__cell--mw28"><p>Шейдер водопада</p></td><td class="table__cell--mw28"><p>Используется для создания многослойных водных эффектов.</p></td><td class="table__cell--mw28">5.4</td></tr><tr><td colspan="1" class="table__cell--mw28"><p>Тканевый шейдер</p></td><td colspan="1" class="table__cell--mw28"><p>Используется в основном художниками по персонажам. Предоставляет дополнительные элементы управления настройками физикализации.</p></td><td colspan="1" class="table__cell--mw28">3.7</td></tr><tr><td class="table__cell--mw28"><p>Пользовательский шейдер</p></td><td class="table__cell--mw28"><p>Н/Д</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>EnergyShield Шейдер</span></p></td><td colspan="1" class="table__cell--mw28"><p>Специфические эффекты Crysis.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>FrozenLayerWip Шейдер</span></p></td><td colspan="1" class="table__cell--mw28"><p>Н/Д</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>FX_VelocityBeamParticles Шейдер</span></p></td><td colspan="1" class="table__cell--mw28"><p>Специфические эффекты Crysis.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p>Голограммный шейдер</p></td><td colspan="1" class="table__cell--mw28"><p>Н/Д</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td colspan="1" class="table__cell--mw28"><p><span>LensOptics.Включить шейдер</span></p></td><td colspan="1" class="table__cell--mw28"><p>Используется для эффектов бликов.</p></td><td colspan="1" class="table__cell--mw28">3.7</td></tr><tr><td colspan="1" class="table__cell--mw28"><p>LightFlares.Шейдер Flare</p></td><td colspan="1" class="table__cell--mw28"><p>Используется художниками по освещению для создания эффекта короны, например свечения лампы. Устарело из-за системы бликов.</p></td><td colspan="1" class="table__cell--mw28"><span>3.7</span></td></tr><tr><td class="table__cell--mw28"><p>Металлический шейдер</p></td><td class="table__cell--mw28"><p>Используется для металлических предметов. Вместо этого используйте Illum.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td class="table__cell--mw28"><p>WaterSurface Шейдер</p></td><td class="table__cell--mw28"><p>Используется для рек. Вместо этого используйте WaterVolume.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr><tr><td class="table__cell--mw28"><p>WaterVols Шейдер</p></td><td class="table__cell--mw28"><p>Используется для озер и других акваторий. Вместо этого используйте WaterVolume.</p></td><td colspan="1" class="table__cell--mw28"><br/></td></tr></tbody></table></figure></div><div class="layout__details--aside"></div></div>
