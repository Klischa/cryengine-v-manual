<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h3 id="playdialog">PlayDialog</h3><p><span>Используется для воспроизведения диалога.</span></p><p><picture><img class="picture" src="../attachments/28901223.png"></picture></p><div><p><strong>Входы</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Порт</th><th>Тип</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Играть</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Воспроизводит диалог</td></tr><tr><td class="table__cell--mw28"><strong>Стоп</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Останавливает диалог</td></tr><tr><td class="table__cell--mw28"><strong>Диалог</strong></td><td class="table__cell--mw28">Строка</td><td class="table__cell--mw28">Название диалога для воспроизведения</td></tr><tr><td class="table__cell--mw28"><strong>StartLine</strong></td><td class="table__cell--mw28">Целое число</td><td class="table__cell--mw28">Строка, с которой начинается диалог</td></tr><tr><td class="table__cell--mw28"><strong>AI Прерывание</strong></td><td class="table__cell--mw28">Целое число</td><td class="table__cell--mw28">AI поведение прерываний; значения: Никогда, Тревога и Бой.</td></tr><tr><td class="table__cell--mw28"><strong>AwareDistance</strong></td><td class="table__cell--mw28">Плавать</td><td class="table__cell--mw28">Расстояние, на котором плеер считается слушающим</td></tr><tr><td class="table__cell--mw28"><strong>AwareAngle</strong></td><td class="table__cell--mw28">Плавать</td><td class="table__cell--mw28">Угол обзора, под которым плеер считается слушающим</td></tr><tr><td class="table__cell--mw28"><strong>AwareTimeout</strong></td><td class="table__cell--mw28">Плавать</td><td class="table__cell--mw28">Тайм-аут, пока неосведомленный игрок не прервет диалог</td></tr><tr><td class="table__cell--mw28"><strong>Флаги</strong></td><td class="table__cell--mw28">Целое число</td><td class="table__cell--mw28">Флаги воспроизведения диалогов</td></tr><tr><td class="table__cell--mw28"><strong>Буфер</strong></td><td class="table__cell--mw28">Строка</td><td class="table__cell--mw28">Сохраняет диалог. В каждый момент времени в каждом буфере может воспроизводиться только один диалог.</td></tr><tr><td class="table__cell--mw28"><strong>BufferDisplay</strong></td><td class="table__cell--mw28">Плавать</td><td class="table__cell--mw28">Сколько еще секунд диалог будет ждать, пока не завершится предыдущий диалог в этом диалоге.</td></tr><tr><td class="table__cell--mw28"><strong>Actor 1–8</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Actor идентификаторы объектов</td></tr></tbody></table></figure></div></div><div><p><strong>Выходы</strong></p><div><figure class="table"><table class="table"><colgroup><col><col><col></colgroup><tbody><tr><th>Порт</th><th>Тип</th><th>Описание</th></tr><tr><td class="table__cell--mw28"><strong>Началось</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Вызывается при запуске диалога</td></tr><tr><td class="table__cell--mw28"><strong>Готово</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Запускается, когда диалог завершен или прерван</td></tr><tr><td class="table__cell--mw28"><strong>Закончено</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Вызывается после завершения диалога</td></tr><tr><td class="table__cell--mw28"><strong>Прервано</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Вызывается при прерывании диалога</td></tr><tr><td class="table__cell--mw28"><strong>PlayerAbort</strong></td><td class="table__cell--mw28">Целое число</td><td class="table__cell--mw28">Срабатывает, когда диалог прерывается из-за того, что игрок находится вне зоны действия или вне поля зрения.</td></tr><tr><td class="table__cell--mw28"><strong>АИАборт</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Вызывается, когда диалог прерывается из-за предупреждения AI</td></tr><tr><td class="table__cell--mw28"><strong>ActorDied</strong></td><td class="table__cell--mw28">Любой</td><td class="table__cell--mw28">Вызывается, когда диалог прерывается из-за смерти Actor</td></tr><tr><td class="table__cell--mw28"><strong>LastLine</strong></td><td class="table__cell--mw28">Целое число</td><td class="table__cell--mw28">Последняя строка, воспроизведенная при прерывании диалога</td></tr><tr><td class="table__cell--mw28"><strong>CurLine</strong></td><td class="table__cell--mw28">Целое число</td><td class="table__cell--mw28">Текущая строка; срабатывает всякий раз, когда начинается строка</td></tr></tbody></table></figure></div></div></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#playdialog" class="nav-tabs__item is-active" title="PlayDialog" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">PlayDialog</div></a></div></div><div class="layout__details--main"></div></div></layout>
