<article class="content">
                            <layout><div class="layout__details"><div class="layout__details--header"><h2 id="core-nodes">Основные узлы</h2><p><strong>Ядро </strong>узлы демонстрируют функциональность для различных целей. </p><h3 id="fail">Неудача</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Возвращает ошибку в качестве результата, независимо от результата выполнения дочернего элемента. А <strong>Неудача</strong> узел имеет ровно одного дочернего узла.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><p>Никогда.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Когда выполнение/обработка дочернего узла завершено.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure><h3 id="random-gate">Случайные ворота</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Имеет ровно один дочерний элемент, который выполняется, когда <strong>Случайные ворота</strong> узел «открыт».</p><p>Вероятность того, что ворота будут «открыты», случайна, хотя степень этой случайности может быть изменена.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Имя параметра</p></th><th><p>Описание</p></th><th><p>Значение</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Шанс открыться</strong></p></td><td class="table__cell--mw28"><p>Изменяет степень случайности открытия врат.</p></td><td class="table__cell--mw28"><p>Принимает значение с плавающей запятой в диапазоне [0,0, 1,0], такое, что:</p><figure class="table"><table class="table"><tbody><tr><td class="table__cell--mw28"><p><strong>0.0</strong></p></td><td class="table__cell--mw28"><p>Случайные Врата всегда будут «закрыты».</p></td></tr><tr><td class="table__cell--mw28"><p><strong>1.0</strong></p></td><td class="table__cell--mw28"><p>Ворота всегда будут «открыты».</p></td></tr></tbody></table></figure><p>Любое среднее значение соответственно влияет на вероятность того, что ворота будут «открыты».</p><p>Например, <strong>Шанс открыться </strong>ценность <strong>0.5</strong> дает воротам 50% шанс быть открытыми.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><p>Когда шлюз «открыт» и его дочерний узел успешен.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Если ворота «закрыты» или если их дочерний узел выходит из строя при «открытии».</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure><h3 id="send-event">Отправить событие</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Отправляет событие в дерево поведения, которое, в свою очередь, может использоваться для инициирования изменения переменной, отметки времени и т. п.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th><p>Имя параметра</p></th><th><p>Описание</p></th><th><p>Значение</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Событие</strong></p></td><td class="table__cell--mw28"><p>Указывает событие, которое должно быть отправлено узлом.</p></td><td class="table__cell--mw28"><p>Принимает любые <strong>Встроенный</strong> или <strong>Игра</strong> Событие как его ценность.</p><p>Однако событие должно быть предварительно определено в блоке определений данных.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><p>Если <strong>Событие</strong> было успешно отправлено.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Если <strong>Событие</strong> не был отправлен.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure><h3 id="suppress-failure">Подавить сбой</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><td class="table__cell--mw28"><p><strong>Описание</strong></p></td><td class="table__cell--mw28"><p>Возвращает успех в качестве результата, независимо от результата выполнения дочернего элемента. А <strong>Подавить сбой</strong> узел имеет ровно одного дочернего узла.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Принятые параметры</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr><tr><td class="table__cell--mw28"><p><strong>Результаты</strong></p></td><td class="table__cell--mw28"><figure class="table"><table class="table"><tbody><tr><th colspan="1"><p>Результат</p></th><th colspan="1"><p>Критерии</p></th></tr><tr><td class="table__cell--mw28"><p><strong>Успех</strong></p></td><td class="table__cell--mw28"><p><span>Как только выполнение/обработка его дочернего узла будет завершена.</span></p></td></tr><tr><td class="table__cell--mw28"><p><strong>Неудача</strong></p></td><td class="table__cell--mw28"><p>Никогда.</p></td></tr></tbody></table></figure></td></tr><tr><td class="table__cell--mw28"><p><strong>Дополнительная информация</strong></p></td><td class="table__cell--mw28"><p>Нет.</p></td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#core-nodes" class="nav-tabs__item is-active" title="Core Nodes" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Основные узлы</div></a><a href="#fail" class="nav-tabs__item" title="Fail" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Неудача</div></a><a href="#random-gate" class="nav-tabs__item" title="Random Gate" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Случайные ворота</div></a><a href="#send-event" class="nav-tabs__item" title="Send Event" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Отправить событие</div></a><a href="#suppress-failure" class="nav-tabs__item" title="Suppress Failure" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Подавить сбой</div></a></div></div><div class="layout__details--main"></div></div></layout>
