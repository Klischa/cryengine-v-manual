<article class="content">
                            <div class="layout__details"><div class="layout__details--header"><h2 id="cvars-and-console-commands">CVar и консольные команды</h2><h3 id="cvars">CVars</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>CVar</th><th>Описание</th></tr><tr><td class="table__cell--mw28">uqs_timeBudgetInSeconds</td><td class="table__cell--mw28">Указывает бюджет времени (в секундах), который UQS разрешено использовать для каждого вызова обновления. На внутреннем уровне этот бюджет времени будет разделен между всеми выполняемыми в данный момент запросами, чтобы обеспечить наилучший возможный баланс нагрузки. Установка для этого CVar значения ниже или равного 0,0 означает, что абсолютно минимальный возможный объем работы с разделением по времени будет выполняться внутри. В этом случае сложные запросы, скорее всего, будут распределены по нескольким кадрам Engine, поэтому их завершение займет значительное время.</td></tr><tr><td class="table__cell--mw28">uqs_debugDraw</td><td class="table__cell--mw28">Если установлено значение 1, на экране отображается некоторая статистика и список текущих запросов в виде 2D-текста. Кроме того, текущие запросы будут отрисовывать примитивы отладки-рендеринга в трехмерном мире в течение 2 секунд после их завершения.</td></tr><tr><td class="table__cell--mw28">uqs_debugDrawZTestOn</td><td class="table__cell--mw28">Если установлено значение 1, примитивы отладки запросов будут включать z-тестирование при отрисовке в трехмерном мире.</td></tr><tr><td class="table__cell--mw28">uqs_debugDrawLineThickness</td><td class="table__cell--mw28">Определяет толщину линий отладочной отрисовки в 3D-мире. Это можно использовать для визуализации, например, raycast, когда в противном случае было бы трудно увидеть.</td></tr><tr><td class="table__cell--mw28">uqs_logQueryHistory</td><td class="table__cell--mw28">Если установлено значение 1, все выполняемые запросы также будут записываться в историю запросов в памяти. Эту историю можно сохранить и восстановить либо через <strong>Инспектор истории запросов</strong> Плагин редактора (или через консольные команды <strong>UQS_DumpQueryHistory</strong> / <strong>UQS_LoadQueryHistory</strong>, см. ниже) и загрузиться в <strong>Инспектор истории запросов</strong> для последующего осмотра.</td></tr></tbody></table></figure><h3 id="console-commands">Консольные команды</h3><figure class="table"><table class="table"><colgroup><col><col></colgroup><tbody><tr><th>Консольная команда</th><th>Описание</th></tr><tr><td class="table__cell--mw28">UQS_ListFactoryDatabases</td><td class="table__cell--mw28">Выводит на консоль все зарегистрированные фабрики для создания элементов, функций, генераторов и оценщиков.</td></tr><tr><td class="table__cell--mw28">UQS_ListQueryBlueprintLibrary</td><td class="table__cell--mw28">Выводит на консоль все схемы запросов из библиотеки.</td></tr><tr><td class="table__cell--mw28">UQS_ListRunningQueries</td><td class="table__cell--mw28">Выводит все текущие запросы на консоль.</td></tr><tr><td class="table__cell--mw28">UQS_DumpQueryHistory</td><td class="table__cell--mw28">Сбрасывает все запросы, которые были выполнены на данный момент, в файл XML для десериализации позднее. Сохранение текущей истории в памяти на диск также возможно через <strong>Инспектор истории запросов</strong> Плагин редактора.</td></tr><tr><td class="table__cell--mw28">UQS_LoadQueryHistory</td><td class="table__cell--mw28">Загружает историю запросов из XML для отладки-рендеринга и проверки в трехмерном мире. Загрузка истории с диска в память также возможна через <strong>Инспектор истории запросов</strong> Плагин редактора.</td></tr><tr><td class="table__cell--mw28">UQS_ClearDeserialzedQueryHistory</td><td class="table__cell--mw28">Очищает историю запросов, ранее загруженных с диска в память. Это также возможно через <strong>Инспектор истории запросов</strong> Плагин редактора.</td></tr></tbody></table></figure></div><div class="layout__details--aside"><div class="nav-tabs container"><a href="#cvars-and-console-commands" class="nav-tabs__item is-active" title="CVars and Console Commands" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">CVar и консольные команды</div></a><a href="#cvars" class="nav-tabs__item" title="CVars" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">CVars</div></a><a href="#console-commands" class="nav-tabs__item" title="Console Commands" rel="noreferrer, nofollow, noopener"><div class="nav-tabs__item--label">Консольные команды</div></a></div></div></div>
