<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="doc" style="max-width:680px;margin:0 auto;padding:40px 24px">
<button id="langToggle" class="lang" type="button" style="float:right">RU</button>
<h1 id="t">Select an article</h1>
<p id="p">Click any entry in the menu on the left — the article opens in this area.
The <span class="navbtn">☰</span> button collapses the menu while you read.</p>
<script>
const RU={t:"Выберите статью",p:"Нажмите любой пункт меню слева — статья откроется здесь. Кнопка ☰ сворачивает меню на время чтения."};
const EN={t:"Select an article",p:"Click any entry in the menu on the left — the article opens in this area. The ☰ button collapses the menu while you read."};
function setLang(l){
 localStorage.setItem('lang',l);
 const o=(l==='ru')?RU:EN;
 document.getElementById('t').textContent=o.t;
 document.getElementById('p').textContent=o.p;
 document.getElementById('langToggle').textContent=(l==='ru')?'EN':'RU';
 document.documentElement.lang=l;
}
document.getElementById('langToggle').addEventListener('click',()=>setLang(localStorage.getItem('lang')==='ru'?'en':'ru'));
setLang(localStorage.getItem('lang')||'en');
</script>
</body></html>
